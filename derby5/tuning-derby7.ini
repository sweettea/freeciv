; ---- DERBY-7 riders (2026-08-14, human call) ------------------------
; Exhibition arm, not a tuned verdict. Above, the four lean zeros
; (derby-6 winner: garrison_floor_danger, floor_interior_weight,
; boat_shadow_fear, density_fear_value) replace their pv2 values.
; Below, the post-pv2 knobs this file opts into:
;
; fence: benchmark mixed REJECTED it (task #63) but the derby is
; team-vs-team where blocking cross-team peace is the intent.
diplo_deep_only_pacts = 1
; berth routing: NULL on open sea, but its stranded-founder population
; is closed-water geometry -- Europe's lakes and inlets (task #39).
founder_berth_route = 1
; scheduled decay (DECAY slice 2): opinionated values = the slice-1
; MEASURED anchors, not a tune -- world discount rate 0.037/turn
; T1-50 collapsing to 0.002 after T100 (98-scorelog corpus,
; benchmark/decay-anchors.py). Break band 50/100 = the census's
; measured phase boundaries.
horizon_decay_gate = 1
horizon_decay_early = 0.057058
horizon_decay_late = 0.037030
horizon_decay_break_start = 22
horizon_decay_break_end = 163

; ---- DERBY-7 spicy block (2026-08-14, human call: "I would rather get
; opinionated guesses hilariously wrong than safe boring current
; behavior"). Every value below is a dormant mechanism switched ON at
; its tested on-arm or tuned value. None of this is a verdict.
;
; reach: real on pv1 (+71.9, t +2.58), null on pv2 -- Europe gets it.
survival_pf_reach = 1
; pin discount: measured never-left share; wash on benchmark, free
; defensively even at 36% of wave mass.
threat_pin_discount = 0.687
; reinforcement pricing: the measured arm (observed surplus/cost),
; replacing the flat 0.2 that over-charges 99.4% of targets ~4.5x.
invasion_reinforce_rate = 0.0
invasion_reinforce_slope = 1.0
; W12 trunk roads + worker travel discount at the merged on-arm values
; (link gap 12->3); Europe's long land corridors are the habitat.
trunk_road_gain = 40.0
worker_travel_discount = 1.0
; W12 slice 3: allied cities join the trunk node set, so a corridor can
; end at the ally instead of only inside our own empire. Europe is the
; venue this was written for -- long land borders with players deep is
; actually allied to. trunk_source_gain (slice 2) at the unit case both
; A/Bs probed, so workers can be dispatched down the whole corridor,
; not just the ally tiles that fall inside our own city radii.
trunk_ally_gate = 1
trunk_source_gain = 10.0
; W12 slice 4: corridors are priced by the caravan trade they unlock as
; well as by the movement they save, at the unit gain (route value in
; deeptrade's own units, / MORT to a per-turn flow, * TRADE_WEIGHTING
; into the advisor's tile currency). Europe is where the dividend is
; largest for the same reason the corridors are: long land distances
; are exactly what caravan_discount buries, so a road that shortens
; them is worth the most there.
trunk_trade_gain = 10.0
; W12g execution fixes: the site search floors the corridor bid (no more
; settler poaching) and an en-route worker keeps its task unless beaten
; by 25% -- the probed margin from the n=29 A/B (start-rate 8.7->13.2%).
trunk_keepable_gate = 1
trunk_keep_margin = 1.0
; W12H soft borders: a corridor may cross a PEACE partner's ground
; (DS_PEACE or DS_ARMISTICE), and the corridor pathfinder may walk a
; worker there. War, cease-fire and no contact stay refused. Europe is
; the venue this was written for and the reason is the map: long land
; borders between players deep signs treaties with, so the shortest
; road between two of deep's own cities repeatedly runs through a
; neighbour's territory and stops dead at it. Nothing in the rules ever
; forbade the walk or the build -- players_non_invade() exempts
; civilians (common/movement.c:775) and the road enabler asks only for
; Workers + CanRoad -- so this opens a refusal deep chose, not one the
; game imposed.
trunk_soft_border_gate = 1
; trunk_risk_weight is deliberately NOT set here, and the reason is a
; property of the reuse rather than an oversight: the corridor risk term
; is deep's OWN standing fear (deep_density_fear_at() plus
; boat_shadow_fear), and this file zeroes both of those above
; (boat_shadow_fear = 0, density_fear_value = 0, the derby-6 lean
; winner). Every corridor tile would therefore price at risk 0, the
; comparison would decide every step by terrain alone, and the knob
; would be a behaviour change with no risk in it. It goes in when the
; fear it reads does.
; MUSTER B-prime: ops muster WITHOUT the home-trigger churn engine --
; the arm whose value was defensive massing (cities ratio 0.902).
op_muster = 1
op_muster_home = 0
; CONSEQ last-ditch behaviors: evacuate doomed cities, emergency-buy
; on the brink.
evacuate_gate = 1
late_buy_gate = 1
; birth guard + tech wall: the conseq/wrace probe values.
birth_guard_gain = 1.0
defensive_techwall_weight = 1.0
; choke placement: the a6/econ-priors tuned band (5.8-6.4).
site_choke_bonus = 6.0
; naval connection value split (navsee arm); Europe is coasts.
site_naval_connect_weight = 3.0
; expected-wait discount on lift sites (W36 on-arm) -- Europe founding
; is lift-heavy and waits are the census's own defect.
site_wait_discount = 1.0
; government valuation machinery on (GOV epic).
gov_valuation = 1
; TECHMIL slice 2 (pending merge): let deep re-pick research goals and
; SOFTEN the distance division (power < 1) so the farther-out military
; mass can win the argmax -- the exact direction of the census
; diagnosis. Inert until the knobs exist in the binary.
techgoal_deep = 1
techgoal_distance_power = 0.940560
;
; Deliberately left OFF despite being dormant: unit_upkeep_charge
; (CREDIT measured the term 1-2 orders too large -- that is not
; hilarious-wrong, it is known-broken), honest_info (excluded work),
; and the NETTHREAT gain knobs with no tested scale on file.
;
; IDLE-WORKER POLICY (this epic). The carpet the live Europe game
; showed -- fortresses on nearly every catchment tile while the road to
; the human ally went unbuilt -- is what deep does when a city's
; improvement backlog empties, and it is NOT price-sensitive: derby-7's
; own base_fort_gain of 15.6 against the compiled 40.0 moved the want
; distribution 4x down and the behaviour not at all (STATUS
; 2026-08-22). The gate stops it at the source: a dedicated worker with
; nothing real to do is held idle, or walked to the nearest own city
; and recycled into its build queue for half its shields.
idle_policy_gate = 1
; The reserve this holds against future demand: mean concurrent
; pollution events per city. DERIVED on contested T150, where it
; measured EXACTLY ZERO -- 150 turns of civ2civ3 never reaches the
; industry that makes pollution -- so 0.0 is the measurement and not a
; choice.
;
; READ THIS IF THE EUROPE GAME PASSES INDUSTRIALISATION. At 0.0 every
; backlog-empty worker is recycled, and a recycled worker is gone: when
; pollution starts arriving the empire pays 2x shields to rebuild the
; corps it dissolved. The deep-pollute line in your own game.log now
; measures the number this wants -- take `percity=` off the last such
; line per player and set this to it.
idle_reserve_per_city = 0.0
