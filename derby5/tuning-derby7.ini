; derby4/tuning-derby4-personality.ini -- pv2.ini base (benchmark/tuning/
; pv2.ini, unmodified below) with ONE override: stance_source 0 -> 1.
;
; This is derby-3's personality mechanism, not a set of per-nation ini
; files. There is no per-player tuning injection in ai/deep --
; FREECIV_DEEP_TUNING loads one file for the whole server process
; (ai/deep/deeptuning.c:deep_tuning_init), so every deep seat in a game
; shares the same struct tuning. Per-player differentiation instead
; comes from ai/deep/deepstance.c: stance_source=1 seeds each player's
; econ/mil stance axes from that player's own NATION TRAITS
; (ai_trait_get_value(TRAIT_EXPANSIONIST/BUILDER/TRADER/AGGRESSIVE)),
; read the same way ai/default already reads them at its own call
; sites. Traits only vary per-player if the server draws them, which
; requires `set traitdistribution EVEN` in the launch script's server
; commands (civ2civ3 default is FIXED: every nation gets 50/50/50/50,
; making the trait-seeded axes exactly identity -- see
; benchmark/configs/smoke-traits.conf and doc/deep-ai/sessions/
; S-E34.3-traits.md). This combination (stance_source=1 +
; traitdistribution EVEN) is exactly what commit 000c79971f ("doc:
; derby 3 final") describes as "EVEN traits + trait-seeded stances".
;
; stance_trait_span is left at pv2's placeholder 0.5 (untuned, rule 7:
; do not invent a replacement number). stance_source is the only line
; changed from pv2.ini; every other value below is copied verbatim.
