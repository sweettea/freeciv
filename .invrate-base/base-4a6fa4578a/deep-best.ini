; Best-known full tuning for ai/deep, 2026-08-02, from campaign-a6/-b6.
;
; BASE: campaign-b6 best (ALL/ECON/MIL, 2 rounds, europe-priors-b5).
;   held-out mean paired diff +58.8 over 10 seeds, 3 cells, seeds 101-110.
;
; Why b6 and not a6, when a6's holdout is nominally higher:
;   a6  training +76.1 -> holdout +62.2   (winner's curse -18%)
;   b6  training +94.5 -> holdout +58.8   (winner's curse -38%)
; The two are a statistical tie on the blend, so the tiebreak is a
; direct measurement instead: on lategame-80, 10 paired seeds, one
; binary and two tuning files, score ratio vs baseline was
;   a6 0.9897   b6 1.0394
; a6 is BEHIND baseline on the crowded cell. It also drove
; site_overlap_weight to 0.007 and site_rival_pressure to 35.9 -- both
; free in its two island cells and paid for only in the crowded one --
; where b6, searching 93 params over two rounds, left them at 0.048 and
; 9.93. A term two independent searches disagree about by 7x and 3.6x
; is overfitting, and a6 is the one doing it.
;
; The three parameters added 2026-08-02 are set to ZERO here, not to
; their code defaults (16.0 / 0.9). Measured on lategame-80, 10 paired
; seeds, both tunings: crowding scaling moved cities +0.6 (a6, 4/10)
; and +0.1 (b6, 3/10), t < 1 on every arm. It measured flat, so the
; play file does not carry it.
;
; Unevaluated as a whole file -- b6's holdout was measured WITHOUT the
; three zeroed parameters, which are inert at 0, so the number carries.
; Fine for playing; quote +58.8, never +94.5.
;
; W02b (2026-08-02) DELETED four parameters this file was tuned with:
; site_tail_weight, site_depth_weight, site_overlap_weight and
; site_overlap_crowding no longer exist -- the catchment is valued as a
; stream of discounted citizen-turns, not as a weighted average, so the
; weights have nothing left to weigh. Their lines are removed rather
; than left as dead keys, which the loader would ignore in silence.
;
; site_travel_discount is RAISED from b6's 0.654809 to the human-set
; 0.9. With the stream, d is the delay to every citizen arrival, so
; d = 1 is the literal truth and below 1 prices the fact that a built
; settler's alternatives are poor; 0.65 claimed the delay was a third
; cheaper than reality and put 9% of settler missions past 40 turns on
; an 80-turn cell. The loader does NOT clamp file values to the
; params.ini range [0.75, 1.0], so leaving 0.65 here would have made
; the change inert exactly where it matters most.
;
; The catchment half of this file is therefore NO LONGER TUNED:
; site_stream_weight sits at its compiled placeholder 1.0. The military
; block, the horizon credits and the rest still carry b6's values, and
; the +58.8 above was measured with the deleted weights active. Treat
; the site terms as untuned until the next campaign.
;
;   FREECIV_DEEP_TUNING=$PWD/deep-best.ini ./build/freeciv-server ...
