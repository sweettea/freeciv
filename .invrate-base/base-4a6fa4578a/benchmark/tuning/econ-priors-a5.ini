; MACHINE A START FILE for campaign-a5 (ECON block).
;
; 83 parameters HARVESTED from campaign-a4's best-tuning.ini, which
; scored a HOLDOUT mean paired diff of +16.8 over 8 seeds (101-108,
; three cells) -- the first positive held-out number this project has.
; Its TRAINING objective was +39.4, so the winner's curse took ~57%;
; the sign survived. That +16.8 is the reportable figure, not +39.4.
;
; 9 parameters are NEW tonight and did not exist in campaign-a4's
; 83-parameter space. Their start values below are PLACEHOLDERS or
; single-cell probes, NOT results:
;
;   site_travel_discount = 1.0 replaces stock's PERFECTION=3. Chosen
;     from a 3-seed, single-arm primary-120 sweep where d=1.0 gave
;     cities/player 18.3 -> 27.9 and deep absolute score +19% against
;     the d=3.0 control. THREE SEEDS IS NOT A RESULT -- it is a better
;     starting point than a constant whose own comment says it means
;     something else. It also happens to be the discount convention
;     every horizon building credit already uses.
;   The rest ship at the values that reproduce stock exactly
;     (site_potential_weight 1.5, settler cost 1.0, boat 1/3), at zero
;     (site_travel_crowding, which CANNOT be learned on these cells --
;     deep_map_crowding() saturates at 1.0 on all of them), or at
;     untested placeholders (site_rival_pressure, caravan_*,
;     horizon_multiplier_weight).
;
; Nothing here may be cited as a tuned value. It exists to carry search
; progress across a code change, per the 458d66194f pattern.

