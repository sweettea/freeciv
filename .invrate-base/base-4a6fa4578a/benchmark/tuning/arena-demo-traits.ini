; The arena tier's demonstration candidate.
;
; One key, chosen because it is VISIBLE per seat in the ordinary game
; log: stance_source = 1 seeds each player's stance axes from its
; nation's traits, so the deep-stance line prints src=traits and
; identity=0 for a seat running this file and src=identity,
; identity=1 for a seat running benchmark/tuning/identity.ini.
;
; That is what makes it the attribution witness for
;   benchmark/arena.py --candidate id=tuning/identity.ini \
;                      --candidate tr=tuning/arena-demo-traits.ini
; -- the per-seat scores are keyed by file, and the log independently
; says which values each seat actually played.
;
; It is a DEMO, not a candidate anyone should fold: one key against the
; identity file is not an experiment.

[tuning]
stance_source = 1
