; R3 arm ALL: every scale the corpus supports, at once.
; scale_settler 0.20   -- see r3-settler.ini
; scale_worker  3.0    -- the worker bid is p50 37 / 51 against the
;                         same anchor, 2.5x and 3.7x too COLD
; emergency_value_cap 400 -- above every honest emergency want in 40
;                         games (first defender max 353, W01's
;                         diplomat 300, defense building 398) and
;                         below the 5th percentile of the
;                         kill_something_with spikes (p50 2705-6485)
; The military scales stay 1.0: the corpus does NOT support them.
; Their winner-conditioned ratios to the anchor invert between cells
; (defender 3.40 contested against 0.33 isolated), so there is no
; number to derive.
[tuning]
pay_switch_penalty = 1
switch_cost_price = 1
scale_settler = 0.20
scale_worker = 3.0
emergency_value_cap = 400.0
