; TRADE arm: the corrected price at the untuned corner (gain 1.0). trade_merit is R2's
; master switch and every new pricing term lives inside it; the two
; stance knobs sit outside it and are written out at their compiled
; zeros so the arm is explicit rather than implied.
; The switch-penalty pins are the standing ones (HEDGE, STATUS
; 2026-08-06): no arm of any A/B may differ in that handicap.
; NOTE: float keys MUST carry a decimal point -- secfile stores `0` as
; an INT entry and the loader falls back to the compiled default.
[tuning]
pay_switch_penalty = 1
switch_cost_price = 1
trade_merit = 1
trade_merit_gain = 1.0
trade_ceasefire_peace_odds = 0.0
trade_route_risk_gain = 0.0
trade_route_love = 0.0
trade_partner_target_discount = 0.0
