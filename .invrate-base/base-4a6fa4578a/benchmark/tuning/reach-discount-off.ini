; The reachability DISCOUNT off (session G1 rider): every neighbour
; counts at full weight whether or not it can reach us.
;
; menace_overseas_weight is the one knob behind both reachability
; gates -- deep_density_fear()'s cross-water discount for a neighbour
; that floats no transports (deepdefence.c:795) and
; deep_garrison_menace()'s discount for a wholly overseas army
; (:914). Setting it to 1.0 disables both, which is the honest scope
; of this arm: it isolates the DISCOUNT, not the density term alone.
; The gate has shipped in every benchmarked binary and has never been
; isolated (NEXT-SESSION hand-off from M3).

[tuning]
menace_overseas_weight = 1.0
