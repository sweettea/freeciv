; TRADE arm: the corrected price at gain 1.0 for the civ2civ3 cell. Identical to trade-off.ini
; except that peace_seek_gain is PINNED to the value PEACE measured its
; population at (1.0) in BOTH arms: civ2civ3 makes a DOMESTIC trade
; route illegal (National pct 0) and pays IN 100 / INIC 200, so the only
; legal partner is a foreign city at peace or cease-fire. Without the
; pre-pass the population this epic acts on barely exists on this cell.
; PEACE ships that knob at 0.0 and this pin is a measurement condition,
; not a shipped value.
[tuning]
pay_switch_penalty = 1
switch_cost_price = 1
peace_seek_gain = 1.0
trade_merit = 1
trade_merit_gain = 1.0
trade_ceasefire_peace_odds = 0.0
trade_route_risk_gain = 0.0
trade_route_love = 0.0
trade_partner_target_discount = 0.0
