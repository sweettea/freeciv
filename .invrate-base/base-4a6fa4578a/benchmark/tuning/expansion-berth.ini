; EXPANSION slice 3 arm: the founder routing switched on.
;
; founder_berth_route = 1 is a 0/1 switch, not a magnitude. There is
; nothing to sweep: either a founder that cannot be fetched from where
; it stands is sent to a tile from which it can be, or it is not.
;
; The population it acts on was measured before it was built --
; deep-berth coast=1 serves=0, the founder's-eye view of slice 2's 60
; of 67 positive lift gaps sitting on water that closes on its own
; continent. Nothing else is changed: the founder still asks
; aiferry_gobyboat() for a boat from wherever the turn ends, so the
; mission is never dropped for want of a request, and no other knob in
; the lift cluster is touched.
;
; Deliberately NOT combined with slice 2's hull_commission_weight or
; lift_muster_release. Those act on the same causal chain and would
; want a factorial design, not two concurrent arms (CLAUDE.md,
; "parallelise scheduling, not attribution").

[tuning]
founder_berth_route = 1
