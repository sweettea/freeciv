; The identity tuning file: a [tuning] section with zero keys.
;
; Every tunable keeps its compiled default, so a run that loads this
; file must be byte-identical to a run with no tuning file at all.
; That is what makes it the correct control arm for a one-key A/B --
; see doc/deep-ai/STATUS.md, W34 E34.3 FINDING 2 and session H1: the
; loader used to quantise every double tunable to float the moment ANY
; file was loaded, so tuning=none was NOT a valid control.
;
; tests/deeptuning_test.c guards the identity in the unit suite.

[tuning]
