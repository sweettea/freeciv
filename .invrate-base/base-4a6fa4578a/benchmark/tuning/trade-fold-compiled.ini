; The FOLD equivalence control: pins ONLY the standing switch-penalty
; keys, so peace_seek_gain and trade_route_love come from the COMPILED
; defaults. On a binary built after the flip this must be identical to
; trade-fold-on.ini on a binary built before it -- which is how the
; default change is proved to be exactly the two values and nothing
; else.
[tuning]
pay_switch_penalty = 1
switch_cost_price = 1
