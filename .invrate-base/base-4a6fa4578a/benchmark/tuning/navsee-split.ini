; Single-mechanism probe arm for the graded maritime premium
; (S-NAVSEE part B, human design 2026-08-05).
;
; Stock pays one NAVAL_EMPHASIS = 20% of a site's whole value for
; adjacency to any ocean-class tile. This arm splits that 20 into the
; two goods it conflates:
;
;   site_naval_weight          17   coastal YIELD, any workable water
;   site_naval_connect_weight   3   option value, only where the water
;                                   bridges off this continent
;
; A connected site is therefore priced EXACTLY as it is today (17 + 3
; = 20) and a dead-water site loses 15% of its premium. The split is
; zero-sum by construction so that the arm tests the DISTINCTION and
; not the magnitude of the premium, which is a separate knob and a
; separate question.
;
; WHERE THE 3 COMES FROM, and what it is not. It is a PLACEHOLDER for
; the tuner; the argument is only for its ORDER. D3's isolation
; measured the VETO form of this same distinction -- withhold 100% of
; the premium at closed water -- at -11.68 want (se 8.02, t -1.46,
; 7/20) on isolated-150, which is why site_naval_gate ships at 0.
; Withholding 15% instead of 100% cannot reproduce that damage if the
; response is anywhere near linear (~-1.8, well inside that se), while
; deep-sitenaval's connect= and connectwant= make the term's firing
; and its score contribution directly countable. A first arm that
; cannot repeat a known negative result and can still be seen firing
; is the right first arm; the cut itself is owed to a tuning pass.
;
; Venue: isolated-150 (the cell the veto was measured on, so the two
; results are comparable) with a coastal guard cell. n=40 was the
; brief's bar.
[tuning]
site_naval_weight = 17.0
site_naval_connect_weight = 3.0
