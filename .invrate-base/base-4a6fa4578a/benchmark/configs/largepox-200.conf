# LARGEPOX CELL (2026-08-02): a roomy island cell -- one private
# continent per player, 380 land tiles each, 200 turns -- added to give
# the site-scoring work a venue with room to spread out. lategame-80 has
# 80 land per player and primary-120 has 400 on a shared fractal map;
# this is the third point, roomy AND uncontested.
#
# ITS ORIGINAL PREMISE WAS FALSIFIED, and the header is rewritten rather
# than left arguing it. The cell was written on the theory that "~14
# generously spaced cities is the natural play" here and that the AI was
# free to choose 21 tight ones instead, so spacing would become a real
# decision. Measured, deep chooses ~35 cities at ~11.6 land each, and the
# median founded city sits exactly at citymindist -- the same density it
# uses at 80 land per player. Spacing is pinned by the ruleset minimum,
# not chosen (STATUS 2026-08-02 evening; the whole W02b catchment-stream
# epic moved it 0.07 tiles).
#
# The cell is kept because that is exactly what makes it useful: it is
# the venue where a change that finally DOES move spacing would show up,
# and it is the only roomy uncontested cell in the matrix. It is also
# where deep's head-to-head advantage over ai/default is largest, since
# nothing interrupts development.
#
# ISLAND generator, one island per player: no rival pressure, no border
# contest, no early war. Deliberate -- this cell isolates the development
# question. It is the complement to lategame-80, not a replacement.
#
# 200 turns rather than garden2b's 300, and four players rather than two.
# garden2b showed that a long two-player island game stops being a
# development race and becomes a conquest lottery (6 of 14 games ended
# with one side holding over five times the other's cities); it is
# retired for head-to-head. Four players and a shorter horizon keep the
# navies from deciding it.
#
# Two settlers, not eight: expansion has to be EARNED from the site
# scoring under test, not seeded by the lobby. lategame-80's twelve
# starting settlers are why its city count says more about startunits
# than about the AI.
PLAYERS=4
ENDTURN=200
SKILL=hard
RULESET=
TIMEOUT_S=7200
GENERATOR=ISLAND
TILESPERPLAYER=380
EXTRA_SERV='set startunits ccwwx
set dispersion 3
set onsetbarbs 500
set animals 0'
