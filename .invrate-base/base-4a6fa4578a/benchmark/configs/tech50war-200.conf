# TECH-50 WAR CELL (2026-08-10): the era-reachability finding (M4a) and
# the d3-mil-r2 outcome audit both showed no canonical war venue can
# CONCLUDE a war — contested@150 ended with 0 eliminations in 16/16
# mixed games, so the mixed objective degrades to score-under-arms and
# war-prosecution knobs get no gradient. This cell starts at techlevel
# 50 (the lategame-80 pattern: Gunpowder-era armies from turn 1) on
# contested's proven war-forcing geometry, with a longer horizon so
# wars can finish. Startunits/dispersion copied verbatim from
# lategame-80; migration deliberately absent (that is an ECON-regime
# force, not a war one).
#
# ENDTURN=200 is provisional pending the calibration game: if
# eliminations happen well before 200, trim; if games run too long to
# afford, trim; both are harness economics, not tuning constants.
