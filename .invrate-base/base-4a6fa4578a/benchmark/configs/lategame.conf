# Late-game simulation cell (human design 2026-07-31): start at tech
# level 50 with a colonial wave of units (8 settlers, 2 explorers,
# 10 workers) so short games exercise the developed-world dynamics
# the early cells never reach -- gunpowder-era combat, real sieges,
# transports available from turn 1, operations with meaningful force
# requirements. Closes the bundle-intake measurability caveat for
# the combat/ops/naval workstreams; joins the v4 tuning mix beside
# the early-game cells, not instead of them.
PLAYERS=6
XSIZE=40
YSIZE=40
ENDTURN=120
SKILL=hard
RULESET=
TIMEOUT_S=2700
EXTRA_SERV='set techlevel 50
set startunits ccccccccxxwwwwwwwwww
set dispersion 3'
