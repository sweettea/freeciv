# TUNING CELL (2026-08-02): classic-rules twin of primary-120, added to
# the campaign blend as the RULESET GUARD.
#
# Why it exists. All three original tuning cells (lategame-80,
# isolated-150, primary-120) are civ2civ3, so every one of the 96 tuned
# constants is conditioned on a single ruleset and nothing in the
# campaign would ever reveal it. The ten -classic cells in this
# directory are validation cells that no campaign runs.
#
# The settling constants are the worst exposure, because the rules that
# set the largepox/smallpox optimum differ between the two rulesets:
#
#   Settlers pop_cost      civ2civ3 2      classic 1
#   illness (size risk)    on              off
#   size caps              aqueduct 8 / sewer 16   different thresholds
#   Empire_Size_Base/Step  government effects, different values
#
# A weight that is right at pop_cost 2 with plague risk is not
# obviously right at pop_cost 1 without it. If a constant only works on
# civ2civ3, this cell is where it shows up as the one that stops
# improving while the others climb.
#
# Identical to primary-120 in every other respect -- same players, map,
# turns, generator, density and migration settings -- so the only
# variable is the ruleset. Migration is kept for the same reason it is
# kept there: an environmental force applied equally to both arms.
PLAYERS=6
ENDTURN=120
SKILL=hard
RULESET=classic
TIMEOUT_S=7200
GENERATOR=FRACTAL
TILESPERPLAYER=400
EXTRA_SERV='set migration enabled
set mgr_distance 6'
