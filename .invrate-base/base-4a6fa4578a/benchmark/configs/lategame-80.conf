# TUNING CELL (2026-08-01): lategame truncated to 80 turns with
# citizen migration enabled, for the tuning campaign. Both machines use
# the same three cells (lategame-80 / isolated-150 / primary-120) so the
# economy pass and the war pass are the SAME venue under different
# regimes, which is what makes their results mergeable.
#
# migration + mgr_distance 6 (the maximum, 1 + CITY_MAP_MAX_RADIUS):
# citizens walk toward the better empire, so economic quality shows up
# in city sizes and score instead of only in build orders. Neither
# ai/default nor ai/deep models migration (that is W17), so it is an
# environmental force applied equally to both paired arms.
PLAYERS=6
XSIZE=40
YSIZE=40
ENDTURN=80
SKILL=hard
RULESET=
TIMEOUT_S=2700
EXTRA_SERV='set techlevel 50
set startunits ccccccccxxwwwwwwwwww
set dispersion 3
set migration enabled
set mgr_distance 6'
