# isolated-150 with the traits the game already randomises actually
# RANDOMISED (2026-08-05, W34 E34.3).
#
# Everything below is isolated-150 verbatim plus one server setting.
# It exists because 'traitdistribution' defaults to FIXED
# (GAME_DEFAULT_TRAIT_DIST_MODE, common/game.h:517) and no shipping
# nation overrides the ruleset's trait limits, so on every cell this
# project has ever run, all four AI players draw the SAME four trait
# values -- civ2civ3's defaults, 50/50/50/50, verified in the savegame.
# W34 A.1a seeds the stance axes from those traits, which is the right
# source; it just has nothing to read here. Under FIXED the trait
# source is exactly inert (every axis equal, every gate at 1.0), which
# is correct behaviour and unmeasurable behaviour at the same time.
#
# EVEN draws each trait uniformly from the nation's [min, max] --
# 30..90 in civ2civ3 -- which is the distribution the ruleset ships
# and the one the trait system was written for. It is an environmental
# setting applied equally to both paired arms, exactly like migration
# above, and it is NOT a personality system: the values still come
# from the ruleset and the nation.
#
# Pairing note: EVEN calls fc_rand() per trait per player at init, so
# this cell's RNG stream differs from isolated-150's from turn 0. Its
# numbers are comparable ARM TO ARM within the cell and are NOT
# comparable to isolated-150's absolute levels.
#
# --- isolated-150 (2026-08-01), unchanged: ---
# TUNING CELL: isolated truncated to 150 turns with citizen migration
# enabled, for the tuning campaign. Both machines use the same three
# cells (lategame-80 / isolated-150 / primary-120) so the economy pass
# and the war pass are the SAME venue under different regimes, which is
# what makes their results mergeable.
#
# migration + mgr_distance 6 (the maximum, 1 + CITY_MAP_MAX_RADIUS):
# citizens walk toward the better empire, so economic quality shows up
# in city sizes and score instead of only in build orders. Neither
# ai/default nor ai/deep models migration (that is W17), so it is an
# environmental force applied equally to both paired arms.
PLAYERS=4
XSIZE=56
YSIZE=56
ENDTURN=150
SKILL=hard
RULESET=
TIMEOUT_S=5400
GENERATOR=ISLAND
SPECIALS=400
EXTRA_SERV='set migration enabled
set mgr_distance 6
set traitdistribution EVEN'
