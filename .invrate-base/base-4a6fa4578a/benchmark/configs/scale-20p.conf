# SCALING CELL (2026-08-01): the 20-player, many-city case that
# findings/scaling.md is written about. Not a scoring cell -- nothing
# here is paired against anything, and the arms are not comparable to
# the tuning cells. It exists to make AI turn cost measurable.
#
# The costs under investigation are quadratic in CITY COUNT
# (base_want, O(own_cities^2)) and in cities x units (assess_danger),
# so the scenario has to reach many cities quickly rather than play a
# representative game. techlevel 50 plus twelve settlers per player
# seeds roughly 240 cities on turn 1 and lets the map fill from there,
# which sweeps the city count across a wide range WITHIN one game --
# each turn is a sample of (cities, units, per-bucket seconds), so a
# single run yields the whole scaling curve.
#
# Map: 140x90 = 12600 tiles, 630 per player. Large enough that the
# empires keep growing for the whole run instead of hitting the map
# edge on turn 10 and flattening the curve.
PLAYERS=20
XSIZE=140
YSIZE=90
ENDTURN=120
SKILL=hard
RULESET=
TIMEOUT_S=28800
EXTRA_SERV='set techlevel 50
set startunits ccccccccccccxxwwwwww
set dispersion 3'
