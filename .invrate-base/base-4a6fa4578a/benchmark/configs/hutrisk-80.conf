# THE HUT-RISK VENUE, and the reason it had to be added.
#
# The hut-risk term (hut_risk_radius / hut_risk_discount /
# hut_risk_honest, deepexplore.c) is gated on the server's own ability
# to unleash hut barbarians: barbarianrate != DISABLED AND
# turn >= onsetbarbarian. Measured 2026-08-12 with the new deep-explore
# counters, the existing corpus cannot exercise it, because its
# hut-DENSE cells and its barbarian-ARMED cells are disjoint:
#
#   cell        huts        armed?                     huts_vis seen
#   huts        150         NO  (civ2civ3 onsetbarbs   -- (T80 < 120)
#                                120 > ENDTURN 80)
#   smoke       ~15 default NO  (T100 < 120)           max 1, armed=0
#                                                      on all 400 lines
#   storm-150   ~24 default YES (onsetbarbs 30)        max 1
#   raging-120  ~15 default YES (onsetbarbs 40)        ~as smoke
#   THIS CELL   150         YES (onsetbarbs 30)        38 armed lines
#                                                      with a hut in view
#
# So the term has never had a decision population anywhere: either no
# barbarians can spawn, or there is at most one hut in sight. That is
# not a tuning gap, it is a venue gap, and it is why both knobs sat at
# NO-INSTRUMENT in findings/knob-coverage.md with nothing to instrument.
#
# This cell is huts.conf's geometry and hut density with storm-150's
# barbarian onset. Nothing here is invented: every value is copied from
# an existing canonical cell, and the point of the pairing is that the
# armed window (T30-T80) overlaps the turns when 150 huts are still on
# the map and being raced for.
#
# What it is for: the A/B on hut_risk_honest (benchmark/tuning/
# hutflip-probe.ini), which corrects a sign the server disagrees with --
# huts near a city CANNOT unleash (data/default/default.lua:112), so
# the shipped radius form discounts exactly the safe ones. Also the
# venue for any future explore_hut_value x hut_risk_honest factorial,
# which is the shape that question actually wants.
#
# WHAT ONE PAIRED GAME ON IT ALREADY SHOWED (seed 1, T80, both arms):
#
#                             honest=1        honest=0 (shipped)
#   deep-explore lines             338             333
#   armed lines                    222             217
#   lines with a hut in view       105             100
#   lines with huts_disc > 0         0              33
#   lines with huts_unleash > 0     51              51
#   armed AND huts_unleash > 0       0               0
#
# The shipped form discounts huts on 33 lines; the corrected form
# discounts on none, because during the armed window every hut deep can
# see stands inside some city's max city map, where the server refuses
# to unleash. The discount in force is therefore spent entirely on
# provably risk-free huts -- the sign error made visible -- and the
# correction's effect here is to stop paying it. The arms diverge (338
# vs 333 lines), so the knob is live. One game is liveness, not a
# result.
PLAYERS=4
XSIZE=40
YSIZE=40
ENDTURN=80
SKILL=hard
RULESET=
TIMEOUT_S=1800
HUTS=150
EXTRA_SERV="set barbarians NORMAL
set onsetbarbs 30"
