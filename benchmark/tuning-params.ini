; the pathfinder confirms it can arrive within survival_horizon --
; terrain, ZOC and all -- instead of on straight-line distance over
; move rate alone. A mechanism switch, not a magnitude: the measured
; gap (19.1% of furthest admitted attackers unreachable, 25.6% slower,
; 0.0% faster) is what it removes. 0 = the straight line, as before.
