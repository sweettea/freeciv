; The stance layer (W34 phase A). stance_forced and stance_source are
; MODE switches, not magnitudes: a campaign pins them by hand per pass
; and reports which mode it ran in, so their ranges are degenerate on
; purpose and the optimiser cannot move them. stance_trait_span is the
; depth of a pinned corner today and the reach of a trait in E34.3 --
; it is part of the pin, so it is pinned too until E34.3 widens it.
stance_forced              = -1,  -1,   -1,   int
stance_source              = 0,    0,    0,   int
stance_trait_span          = 0.5,  0.5,  0.5, float
stance_fear_gain           = 1.0,  0.0,  3.0, float
stance_op_gain             = 1.0,  0.0,  3.0, float
stance_growth_gain         = 1.0,  0.0,  3.0, float
stance_expand_gain         = 1.0,  0.0,  3.0, float
stance_assault_gain        = 1.0,  0.0,  3.0, float
stance_floor_gain          = 1.0,  0.0,  3.0, float
rates_enabled              = 0,    0,    1,    int
rates_science_gain         = 1.0,  0.0,  5.0,  float
rates_luxury_gain          = 1.0,  0.0,  5.0,  float
; Caravan build want on merit. trade_merit is the off-switch (0 =
; stock's dai_choose_trade_route bid untouched); the gain is the
; NPV-to-build-want conversion the epic could not derive and a tuning
; pass must find.
trade_merit                = 0,    0,    1,    int
trade_merit_gain           = 1.0,  0.1,  5.0,  float
; Wonder-caravan build want on merit (the same reform on the producer
; that actually decides most caravan builds). wonder_merit is the
; off-switch (0 = stock's dai_choose_help_wonder bid untouched); the
; gain is the share-of-wonder-to-build-want residue.
wonder_merit               = 0,    0,    1,    int
wonder_merit_gain          = 1.0,  0.1,  5.0,  float
; Whether a deep seat pays the change-production penalty a human pays.
; server/citytools.c:3221 exempts every AI without H_PRODCHGPEN, and no
; level above `easy` sets it; deep issues itself the handicap instead.
; A pure honesty switch, not a magnitude: 0 = the AI exemption, which
; is every measurement taken before 2026-08-06. Compiled default 1 by
; human call: deep pays, ai/default and ai/baseline still do not.
pay_switch_penalty         = 1,    0,    1,    int
; Whether the build auction PRICES that switch, debiting each candidate
; by the shields city_change_production_penalty() really forfeits,
; converted at SHIELD_WEIGHTING. 0 restores the unpriced arm.
switch_cost_price          = 1,    0,    1,    int
switch_cost_gain           = 1.0,  0.1,  3.0,  float
scale_settler              = 1.0, 0.02,  2.0,  float
scale_worker               = 1.0, 0.05,  3.0,  float
scale_defender             = 1.0, 0.05,  3.0,  float
