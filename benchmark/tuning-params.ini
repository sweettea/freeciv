; H_TARGETS onto its own player in its own phase hook (RC6, W04).
; A STRUCTURAL EXPERIMENT FLAG, not an optimiser knob: 1 is expected to
; make deep worse, because the handicaps close the ~18 gated sites while
; every ungated ground-truth read (survival census, enemy-city worth,
; stock's Tier-3 layer) stays omniscient. See
; findings/omniscience-census-2026-08-11.md. 0 = off = as shipped.
honest_info                = 0,    0,    1,    int
; TECHMIL slice 2 -- deep's own research-goal reselection (deeptech.c).
; techgoal_deep is the gate: 0 = stock's dai_select_tech() untouched =
; byte-identical; 1 = re-select from the same tech_want[] mass with the
; distance divisions raised to techgoal_distance_power. The power is
; only read when the gate is on; 1.0 is stock's shape. The range is a
; SEARCH BOUND for the owed tuning pass: 0.0 flattens distance away
; entirely, 3.0 is strongly nearer-sighted than stock.
techgoal_deep              = 0,    0,    1,    int
techgoal_distance_power    = 1.0,  0.0,  3.0,  float
; CHATTY -- deep's outbound ally comms (deepchat.c). chatty_gate is the
; gate: 0 = deep says nothing and every scan behind the channel is
; skipped = byte-identical; 1 = the four message classes are live.
; chatty_max_per_turn is the rate cap, in LINES per player per turn.
; Both are FLAVOUR: every line is output only, so neither can move a
; score and neither is a tuning target. The range on the cap is a
; sanity bound, not a search space.
chatty_gate                = 0,    0,    1,    int
chatty_max_per_turn        = 3,    0,    12,   int

; S-EXPAND-FIX. A mode switch, not a magnitude: 1 lets a founder want
; contest the military emergency tier on the comparison the founder
; funnel adjudicated (deep's own founder_want against the military
; want, before domestic_advisor_choose_build() clamps the bid to
; DAI_WANT_DOMESTIC_MAX = 750.075 and puts it permanently out of reach
; of the tier floor of 1000). 0 = today's arbitration exactly. Pinned
; by hand per pass, never optimised -- a value between on and off has
; no meaning.
founder_tier_gate          = 0,    0,    1,    int

; S-EXPAND-FIX. A mode switch, not a magnitude: 1 declines to switch a
; city that is already building a founder, with shields in the stock,
; onto a military unit, unless the advisor's own grave_danger signal is
; raised. 0 = today's preemption exactly. Pinned by hand per pass,
; never optimised.
founder_run_hold           = 0,    0,    1,    int
; W29 -- price a cultivate or plant by the best terrain the CHAIN
; reaches instead of the one terrain the action produces (deepterra.c,
; deepchain.c). 0 = the one-step valuation exactly; 1 = the search is
; live. A gate with no companion weight: the price is the advisor's own
; city_tile_value() through its own amortize() and the chain length is
; the ruleset's activity times, so there is no magnitude to search.
terrain_chain_gate         = 0,    0,    1,    int

; CHATTY slice 2 -- deep LISTENS (deeprequest.c). chatty_inbound_gate is
; the gate: 0 = no chat line is ever parsed = byte-identical; 1 = the
; four exact-match ally commands are read, answered and priced. The four
; below are the prices, all PLACEHOLDER, all unreachable without a
; stored request and so all inert while the gate is 0. They are MODE
; company rather than search space: the seats this is used in are the
; ones with a human ally in them, and no scorelog contains an ally.
chatty_inbound_gate        = 0,    0,    1,    int
chatty_request_turns       = 10,   1,    50,   int
chatty_defend_fear         = 50.0, 0.0,  400.0, float
chatty_attack_gain         = 0.5,  0.0,  4.0,  float
chatty_road_gain           = 1.0,  0.0,  8.0,  float

; CAPITAL STAKE -- price the capital by what losing it costs the rest
; of the empire (deepdefence.c, deep_capital_stake_mult()). The gate is
; the mode switch: 0 = the inherited ledger byte for byte; 1 = the
; capital's danger carries 1 + gain x P(civil war) x expected defector
; worth / capital worth. The gain is a ratio of two ai_city.worth
; figures and 1.0 is its identity, so it is DERIVED rather than
; searched; the range is left open either side for a tuning pass that
; wants to ask whether disruption costs more or less than the cities.
capital_stake_gate         = 0,    0,    1,    int
capital_stake_gain         = 1.0,  0.0,  3.0,  float

; POACH SEQUENCING -- take the blade only on the exit that deploys it
; (deepops.c, deep_op_poach_defender(); deepdefence.c). 0 = the
; inherited order, where the blade leaves its wave inside the ask and
; the 76% of claims the arithmetic then refuses have already spent it;
; 1 = the removal moves to the deploying exit. Pure control flow, so
; the range is the mode switch and there is nothing here to search.
poach_deploy_gate          = 0,    0,    1,    int

; POACH ARBITRATION -- price what THIS blade adds, not what the city
; and the operation are worth in total (deepops.c). 0 = the inherited
; totals comparison; 1 = gain = own worth x defence_worth_mult x
; (survival with the blade - survival of the force already assembled),
; loss = conquest worth x (odds with - odds without), claim iff
; gain > loss. Both terms are differences of numbers already computed,
; so there is no magnitude here either.
poach_marginal_gate        = 0,    0,    1,    int
