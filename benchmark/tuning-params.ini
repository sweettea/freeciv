; GIFT-REFOLD (CAMPAIGN-v4 11.4) -- gift_love_gain's bound, repriced by
; the relationship the gift would serve: the alliance and its candidates,
; a rival whose quiet buys a second front we are already paying for, and
; everyone else. 1.0 = today's flat bound for that class; 0.0 = that
; class is never given anything. Sweep WITH gift_love_gain, which is the
; magnitude all three multiply.
;
; DELIBERATELY IN THE `ALL` BLOCK ONLY. These are cross-border by
; construction, and 11.4's whole finding is that an all-deep cell cannot
; tell a positive-sum mechanism from a competitive one -- so putting them
; in a block the ECON search optimises on paired score would tune them on
; the reading that cannot see what they do. They move on a mixed
; head-to-head arm or they do not move.
