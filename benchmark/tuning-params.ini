; S5 -- whether a deep seat declines omniscience, ORing H_MAP, H_FOG and
; H_TARGETS onto its own player in its own phase hook (RC6, W04).
; A STRUCTURAL EXPERIMENT FLAG, not an optimiser knob: 1 is expected to
; make deep worse, because the handicaps close the ~18 gated sites while
; every ungated ground-truth read (survival census, enemy-city worth,
; stock's Tier-3 layer) stays omniscient. See
; findings/omniscience-census-2026-08-11.md. 0 = off = as shipped.
honest_info                = 0,    0,    1,    int
