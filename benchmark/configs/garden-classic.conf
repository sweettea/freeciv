# Garden on CLASSIC rules: civ2civ3 locks Transform Terrain behind
# Fusion Power (endgame; discovered 2026-07-25 via the W29 gate
# audit), so the chain mechanism can only be exercised where the
# ruleset allows it - classic enables transforms as soon as Engineers
# exist. Same solo scarce-island regime as garden.conf otherwise.
PLAYERS=1
XSIZE=24
YSIZE=24
ENDTURN=300
SKILL=hard
RULESET=classic
TIMEOUT_S=3600
GENERATOR=ISLAND
EXTRA_SERV="set landmass 20
set onsetbarbs 500
set animals 0"
