# Europe with a standing giant ally: the user's own Europe game at T191
# (Finnish, 12 cities, biggest 25, allied with the deep Greeks), human
# seat converted to an AI seat and pinned to baseline in every arm, the
# other 15 nations re-seated by arm. One start save for all seeds; the
# RNG is reseeded per seed (RESEED, benchmark/fcrand.py). 100 turns.
# Asks: who builds roads and trade routes to a tall ally when one exists.
# Ruleset: classic (the save's own; a savegame loads its rulesetdir).
PLAYERS=16
ENDTURN=291
SKILL=hard
RULESET=classic
START="$here/starts/europe-ally-T191.sav.zst"   # $here = benchmark/, set by run-game.sh
FIXED_SEATS="12=baseline"
RESEED=1
TIMEOUT_S=10800
