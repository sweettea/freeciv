# PROBE CELL (2026-08-22, S-VENUE-corridor-power): a venue in which a
# connecting road has somewhere to go.
#
# Three W12 slices returned score NULL on `lategame-80` with the
# mechanism strongly live each time. The diagnosis, taken from the
# retained result dirs rather than guessed (STATUS 2026-08-22, this
# session), is that `lategame-80` delivers a corridor DOSE of about
# 1.75 unroaded tiles per planned link: 519 land tiles on a 40x40 map
# shared by 6 seats is ~86 land tiles per player, MST edges between own
# cities run ~5 tiles, half their tiles already carry a road, and the
# starting kit hands every seat ten workers at techlevel 50 to finish
# the rest. A term worth a handful of worker-turns cannot be read at
# any n; the venue, not the term, is what has to change.
#
# Base file: `primary-120.conf` (CANONICAL). Every difference from it
# is listed below with the reason. Nothing else differs -- SKILL,
# RULESET, PLAYERS, GENERATOR and TILESPERPLAYER are primary-120's.
#
#   ENDTURN 120 -> 150
#     The brief's floor, and the payback window is the point: on
#     `lategame-80` a road finished at T40 had 40 turns to repay, here
#     one finished at T50 has 100. Also matches `isolated-150`, so the
#     three-cell tuning grid keeps one horizon in common.
#
#   EXTRA_SERV += `set startpos ALL`
#     All seats on ONE continent. Two things follow that no other
#     canonical cell gives at this land density. (a) `deep_trunk_build()`
#     refuses an MST edge between cities on different continents
#     (`tile_continent` mismatch, deeptrunk.c), so a split empire is a
#     forest of tiny trees; one landmass makes it one tree. (b) An ally
#     corridor measured 1.14 tiles of gap per link on `lategame-80`
#     because an ally's border was usually adjacent; on a shared
#     continent at 400 tiles per player the two empires' cores are far
#     apart and the link between them is a real distance.
#
#   TIMEOUT_S 7200 -> 10800
#     150 turns on a ~2400-land-tile world, the value `longhaul-300`
#     uses. Not a game rule; the harness's own watchdog.
#
# Inherited from primary-120 and load-bearing here, so stated rather
# than assumed: TILESPERPLAYER=400 is 400 LAND tiles per seat against
# the ~86 measured on `lategame-80`, which is the single biggest lever
# on how far apart two cities sit; GENERATOR=FRACTAL builds large
# connected landmasses where ISLAND builds the opposite of what a
# corridor wants; and primary-120 sets no `startunits`/`techlevel`, so
# a seat starts with the ruleset's kit and builds its workers, instead
# of `lategame-80`'s ten-workers-at-techlevel-50 opening that has the
# roads laid before the corridor plan can want them.
#
# migration + mgr_distance 6 carried over verbatim from primary-120:
# citizens walk toward the better empire, so economic quality shows up
# in city sizes and score. Neither ai/default nor ai/deep models
# migration (that is W17), so it is an environmental force applied
# equally to both paired arms.
#
# NOT canonical and not a tuning cell. It exists to answer one power
# question and its verdict is in STATUS; promote it only on evidence.
PLAYERS=6
ENDTURN=150
SKILL=hard
RULESET=
TIMEOUT_S=10800
GENERATOR=FRACTAL
TILESPERPLAYER=400
EXTRA_SERV='set startpos ALL
set migration enabled
set mgr_distance 6'
