# Europe late game, T150 -> T250: the legibility venue (2026-11-02).
# Each seed RESUMES the T150 save that baseline self-play on
# europe-150.conf produced for that seed (the scoreboard's --europe
# stage generates them once per pin, $EUROPE_STARTS/seed-N.sav.zst),
# re-seated per arm, so deep and baseline inherit the same T150
# position and the measurement is what each does with 100 late-game
# turns: roads, trade routes, the long game the 32x32 venues never
# reach. A seed is a history, as in every other venue; the save keeps
# its own RNG state.
PLAYERS=14
ENDTURN=250
SKILL=hard
START="${EUROPE_STARTS:?set EUROPE_STARTS to the directory of seed-N.sav.zst starts}/seed-@SEED@.sav.zst"
TIMEOUT_S=21600   # 6 h: five games hit 3 h on 2026-11-04 under idle priority beside an interactive game
