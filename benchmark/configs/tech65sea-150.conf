# NAVAL WAR CELL (2026-08-12, task #57). The portfolio has a naval
# ECONOMY cell (isolated-150: 4p, roomy islands, migration, lifts) and
# no naval WAR cell at all. tech50war-200's geometry puts every city of
# every seat on one landmass, so the invasion machinery -- ferries,
# beachheads, the overseas go/no-go -- is exercised at near zero.
#
# ISLAND + startpos SINGLE on contested's 32x32 8-player world is the
# answer: one seat per island, islands a few tiles apart on a torus, so
# every war is a war that has to cross water, and the crowding that
# makes contested a war cell is unchanged. 40x40 with startpos 2or3 was
# tried first and is worse -- it gives each seat a land neighbour, and
# the AI fights that one instead (findings/venues-2026-08-12.md §3).
#
# techlevel 65 is the naval equivalent of tech50war's 50, chosen for one
# named advance: Amphibious Warfare sits at 44 recursive prerequisites,
# rank 64 of civ2civ3's 87, so 65 is the smallest start that fields
# MARINES -- the unit that turns a landing into an assault instead of a
# beachhead turn. Measured against the same map at techlevel 50, on two
# seeds each:
#
#                              techlevel 50   techlevel 65 (s1 / s2)
#   Amphibious Warfare              2/8         6/8  /  7/8
#   deep-invade decisions            1          9    /  43
#   deep-wave evals seeing a
#     seaborne wave (by_transport)  116         13   /  349
#   Transports alive at end          3          12   /  7
#   wall clock per game            546 s       412 s / 366 s
#
# ==> deep-wave by_sea IS STILL 0 HERE, AND ALWAYS WILL BE. <==
# It is not this cell's geometry and it is not tech50war-200's. The
# by_sea arm tests `utype_move_type(ut) == UMT_SEA`, and
# set_unit_move_type() is called only by the CLIENT
# (client/packhand.c), so every unit class on the SERVER reports
# UMT_LAND. Proven by a one-shot dump of all nine civ2civ3 classes;
# see findings/venues-2026-08-12.md §0. Read by_transport instead until
# ai/deep's thirteen utype_move_type() call sites are converted to the
# deep_uclass_swims()/deep_uclass_walks() pattern that already exists
# beside them.
#
# KNOWN LIMITS: overseas CAPTURES are rare (2 and 0 in the two
# calibration seeds) -- the AI forms invasions far more often than it
# lands one, which is W31/W33's subject and is what this cell is for.
# Seed variance in naval activity is large (9 vs 43 invasion decisions
# on two seeds), so nothing here may be read off fewer than the usual
# paired counts.
PLAYERS=8
XSIZE=32
YSIZE=32
ENDTURN=150
SKILL=hard
RULESET=
TIMEOUT_S=7200
GENERATOR=ISLAND
EXTRA_SERV='set startpos SINGLE
set techlevel 65
set startunits ccccccccxxwwwwwwwwww
set dispersion 3'
