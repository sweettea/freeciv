# Europe scenario, 14 AI nations, classic ruleset, T150: the legibility
# venue (2026-11-02). The user's standing human-vs-AI game runs on this
# map (play-europe.sh, europe.serv), and its behaviours -- long roads,
# long-distance trade routes, real geography -- are invisible on the
# 32x32 random maps the other venues use. Settings are europe.serv's,
# verbatim, so the measured game is the one the user watches. The map
# is fixed by the scenario; the seed varies start positions and play.
PLAYERS=14
ENDTURN=150
SKILL=hard
RULESET=classic
SCENARIO="$here/../data/scenarios/europe.sav"
TIMEOUT_S=7200
EXTRA_SERV='set nationset all
set traitdistribution EVEN
set startunits "cccccccccwwwwwwwwwwx"
set dispersion 2
set specials 160
set techlevel 20
set migration enabled
set mgr_distance 6'
