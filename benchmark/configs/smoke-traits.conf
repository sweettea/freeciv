# smoke with the traits the game already randomises actually RANDOMISED
# (2026-08-05, W34 E34.3). Second cell for the trait step, for the same
# reason as isolated-150-traits.conf: 'traitdistribution' defaults to
# FIXED, so on the plain smoke cell every player draws civ2civ3's
# 50/50/50/50 and the trait-seeded axes are exactly identity.
#
# EVEN draws each trait uniformly from the nation's [min, max]; it is an
# environmental setting applied equally to both paired arms, and its
# fc_rand() calls at init mean this cell's absolute levels do not
# compare to smoke's.
#
# --- smoke, unchanged: ---
# Small/fast cell of the measurement matrix: 4 players, small map,
# 100 turns, hard difficulty, default ruleset (civ2civ3).
# T100 is the earliest point the Phase-1 proxy metrics move
# (doc/deep-ai/PRD-v3.md Part VIII); one game takes ~30 s.
PLAYERS=4
XSIZE=32
YSIZE=32
ENDTURN=100
SKILL=hard
RULESET=
TIMEOUT_S=1800
EXTRA_SERV='set traitdistribution EVEN'
