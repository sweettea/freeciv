# Two-player island development race at near-primary density: 300
# land tiles per player (human decision 2026-07-29), one fair island
# each from the ISLAND generator, low landmass for real naval
# separation. Supersedes garden2.conf, which kept garden's 24x24 map
# while doubling players (~57 tiles each) -- a knife-fight economy
# useful only as the probe that exposed the naval-invasion hole
# (2026-07-28); garden2 is retired for training/acceptance and kept
# for historical comparability.
PLAYERS=2
ENDTURN=300
SKILL=hard
RULESET=
TIMEOUT_S=5400
GENERATOR=ISLAND
TILESPERPLAYER=300
EXTRA_SERV="set landmass 20
set onsetbarbs 500
set animals 0"
