# Two-player island development race, CORRECTLY sized: garden-parity
# land (~115 tiles per player; 34x34 at landmass 20 ~= 231 land).
# Supersedes garden2.conf as the island regime -- garden2 kept
# garden's 24x24 map while doubling players, halving land to ~57
# tiles each: a knife-fight economy where every lost city is ~20% of
# an empire, useful as the probe that exposed the naval-invasion hole
# (2026-07-28) but not representative of anything. garden2 is retired
# for training/acceptance; kept only for historical comparability.
PLAYERS=2
XSIZE=34
YSIZE=34
ENDTURN=300
SKILL=hard
RULESET=
TIMEOUT_S=3600
GENERATOR=ISLAND
EXTRA_SERV="set landmass 20
set onsetbarbs 500
set animals 0"
