# SCALING CELL (2026-08-01): the OWN-CITIES cell, and the reason the
# scale-20p family is not sufficient on its own.
#
# The two costs findings/scaling.md names are quadratic in different
# things. assess_danger() is O(own_cities x ALL units), so it grows with
# total game size and shows up at any player count. base_want() is
# O(own_cities^2 x player-range improvements) -- squared in the cities of
# ONE player. scale-20p divides its map twenty ways and lands at about
# nine cities per player, where 9^2 is nothing; it cannot see base_want
# no matter how large the total city count gets.
#
# Same 140x90 map, four players. Each gets ~3150 tiles instead of ~630,
# seventeen starting settlers, and twice the turns to keep expanding, so
# own_cities per player runs several times the scale-20p figure and the
# squared term has room to appear. Compare AIT_BUILDINGS between the two
# cells: if it is quadratic in own_cities it moves sharply here and
# barely moves there.
#
# startunits is capped at 21 characters and a longer value is REJECTED
# with the setting left at the ruleset default of "cwsx" -- one settler.
# The rejection is a single line in the server log and the game then runs
# to completion looking healthy, so check the city counts, not the exit
# status. A 24-settler version of this cell ran that way and reported
# 31 cities across four players.
PLAYERS=4
XSIZE=140
YSIZE=90
ENDTURN=120
SKILL=hard
RULESET=
TIMEOUT_S=28800
EXTRA_SERV='set techlevel 50
set startunits cccccccccccccccccxxww
set dispersion 3'
