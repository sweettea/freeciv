# AIR/SPY CELL (2026-08-12, task #51). The M4a era table
# (findings/era-reachability-2026-08-07.md) found Flight in exactly ONE
# canonical cell -- garden2b, the 2-player development race with the
# least combat in the portfolio -- so W32 (air doctrine), the SAM/SDI
# half of the Defend_Bonus sweep, and every W35 slice that needs a Spy
# had no venue at all. tech50war-200 does not fix it: research there is
# near-frozen (50 -> ~56 techs in 200 turns).
#
# The horizon is NOT the lever. Flight sits at 49 recursive
# prerequisites in civ2civ3's 87-advance tree, so a player needs ~50
# techs before it is even researchable, and no cell below T300 has ever
# reached it. The START is the lever: techlevel 80 deals 80 of 87
# advances in valid prerequisite order (give_initial_techs() ->
# pick_random_tech()), which puts Flight, Advanced Flight, Rocketry,
# Espionage and Amphibious Warfare on the board at turn 1. Geometry,
# startunits and dispersion are contested/tech50war-200's, unchanged:
# this cell changes the ERA, nothing else.
#
# techlossforgiveness -1 is the one non-obvious setting and it was
# measured, not assumed. civ2civ3 sets it to 0 (the SERVER default is
# -1, "never lose a tech"), so seats in research debt forget advances
# and a cell built to hold the Flight era leaks out of it. Same seed,
# T200, with and without (findings/venues-2026-08-12.md §2):
#
#                        techloss 0   techlossforgiveness -1
#   Espionage               4/8              8/8
#   Combined Arms           2/8              6/8
#   Rocketry                5/8              8/8
#   deep-air census lines   1967             5777
#   Fighters fielded        2, only at T180  continuous T20..T200
#   wall clock per game     797 s            595 s
#
# It is an environmental force applied identically to both paired arms,
# the same standing migration already has in lategame-80.
#
# ENDTURN=200 is load-bearing: at T120 the helicopter count only ever
# rises, so nothing has been shot down. Air units are BUILT AND KILLED
# only past ~T140.
#
# KNOWN LIMITS, so nobody re-discovers them:
#  * Bombers are never built and Fighters only in ones and twos. That
#    is the W32 gap this cell exists to expose, not a venue defect.
#  * No eliminations in 3 calibration games. Conquest is real (cities
#    change hands) but no seat was extinguished.
#  * Research is deliberately degenerate (80 of 87 advances at turn 1).
#    NO tech-direction, research-pacing or techwall claim may cite this
#    cell.
PLAYERS=8
XSIZE=32
YSIZE=32
ENDTURN=200
SKILL=hard
RULESET=
TIMEOUT_S=7200
EXTRA_SERV='set techlevel 80
set techlossforgiveness -1
set startunits ccccccccxxwwwwwwwwww
set dispersion 3'
