; Tuning blocks for tune.py --blocks (see findings/objective-layer.md).
;
; ==================================================================
; SCREENING TIERS -- read this before designing a campaign
; (2026-08-30, findings/knob-screen-2026-08-30.md)
; ==================================================================
;
; The 2026-08-23 tune-postfix campaign mutated ~80 constants at once
; against an 8-seed objective whose SE was ~41, and selected the max
; of ~40 unreplicated draws. The holdout rejected the result
; (findings/tune-postfix-verdict-2026-08-25.md). The zero-game knob
; screen then established WHY nothing could have been fit: of 277
; tunables, 166 (60%) could not be shown to move a single logged
; decision in 40 games, and 92 of those sit on code that never ran.
;
; The blocks below are cut by that evidence, not by subject matter.
; Three tiers:
;
;   TIER A -- fit directly. 11 continuous knobs, every one with a
;     validated replay rule in knobscreen.py and a MEASURED flip rate
;     on the 40-game s6 corpus. Blocks AUCTION (5) and DEFOPS (6).
;     They do not interact through a shared seam, which is why they
;     are two blocks and not one of eleven.
;
;   TIER B -- group-screen, do not fit. The 28 highest-firing knobs
;     whose instrument runs but whose log carries only one side of
;     the comparison the knob enters, so a flip is not computable
;     offline. Blocks BFEAR (9), BASSAULT (6), BSITE (6), BCIVIL (7).
;     The question a tier-B block asks is "does this SUBSYSTEM move
;     score at all", answered in a handful of arms; only a block that
;     clears its own replicated test earns an individual pass. The
;     cut at 26 fell inside a five-way tie at 73.3 firings/game, so
;     the blocks take all five and the tier is 28.
;
;   RESCREEN -- neither, yet. 8 knobs that this epic's instrumentation
;     (deep-decay-sum bund/cont/mult/grow, deep-bid milclass, the
;     deep-milcap tag) makes reconstructible OFFLINE. Do not buy games
;     for them: run knobscreen.py over any corpus taken after that
;     instrumentation and they get a measured flip rate for free. They
;     then join tier A or drop to tier C on the evidence.
;
;   TIER C -- everything else: PINNED at compiled defaults, and named
;     as pinned in the campaign's own log. Tier C is not a block. It
;     is the complement of the above, it stays inside ALL so no knob
;     becomes unreachable by hand, and no campaign block contains it.
;
; Block width discipline: every block a campaign names must be no
; wider than its seed count, and `tune.py --dry-run` prints a NOTE
; when it is not. All six campaign blocks above are <= 10 constants,
; against the 20-seed venue benchmark/screen-campaign.sh uses.
;
; The old groupings below (S/X/G/M, ALL/ECON/MIL, DECAYTECH, the six
; G sub-blocks) are UNCHANGED and still resolve, so cached results and
; existing scripts keep working. They are subject-matter partitions
; from before the screen existed; prefer the tiers above for anything
; new.
;
; ------------------------------------------------------------------
; TIER A -- measured flip rates, fit directly
; ------------------------------------------------------------------
; flips/game on the 40-game s6-nogates corpus, in brackets.

; AUCTION -- the city-turn build auction and the building anchor it
; bids against. switch_cost_gain [274.7], scale_settler [114.2] and
; scale_worker [51.6] are the three prices on the auction itself;
; upkeep_gold_weight [93.2] and horizon_capacity_weight [11.2] set
; the anchor those bids are compared with.
AUCTION = switch_cost_gain, scale_settler, scale_worker, upkeep_gold_weight, horizon_capacity_weight

; DEFOPS -- the standing-garrison floor, the expansion gate and the
; operation launch bar. garrison_floor_danger, garrison_floor_turn [113.1],
; floor_sea_weight [63.4] and floor_border_weight [53.3] price the
; floor; expansion_war_survival [15.3], founder_pool_per_site [9.9]
; and op_take_target [4.9] are the three verdicts beside it.
; The 2026-08-30 screen's "DEFENCE/OPS"; named DEFOPS because
; --blocks takes a comma list.
DEFOPS = garrison_floor_danger, garrison_floor_turn, floor_sea_weight, floor_border_weight, expansion_war_survival, founder_pool_per_site, op_take_target

; ------------------------------------------------------------------
; TIER B -- group screen: does this subsystem move score at all?
; ------------------------------------------------------------------
; Ranked by instrument firings per game, which is WEAKER evidence than
; a flip rate and must not be read as one. These blocks are screened
; as blocks; an individual knob inside one is never fit off a block
; result.

; BFEAR -- what perceived threat costs, and the ledger it is kept in.
BFEAR = garrison_menace_slope, menace_overseas_weight, satisfied_fear_discount, survival_target, survival_horizon, survival_fear_value, floor_interior_weight, floor_marines_mult, barb_size_ref_cities

; BASSAULT -- what a target is worth and what reinforcing it costs.
BASSAULT = conquest_worth_mult, attack_value_weight, attack_loss_gain, invasion_reinforce_rate, invasion_reinforce_slope, invasion_embark_turns

; BSITE -- site scoring and the travel price paid to reach one.
BSITE = site_stream_weight, site_potential_discount, site_potential_weight, site_settler_cost_weight, site_travel_discount, site_naval_weight

; BCIVIL -- civilian movement, the sea lift, exploration, fortifying.
BCIVIL = settler_fearfulness_mult, worker_flee_radius, worker_guard_radius, explore_explorer_claim, lift_op_slots, colony_lift_weight, base_fort_gain

; ------------------------------------------------------------------
; RESCREEN -- answerable from a log, not from a game
; ------------------------------------------------------------------
; The four horizon ladder components became separable when
; deep-decay-sum started reporting bund/cont/mult/grow beside capadd;
; the three military scale keys became attributable when deep-bid
; started reporting milclass; emergency_value_cap became observable at
; its own seam when deep-milcap was added. Every one of them has a
; replay rule waiting in knobscreen.py. Screen first, THEN decide
; whether they are worth a game.
RESCREEN = horizon_growth_weight, horizon_bundle_weight, horizon_content_weight, horizon_multiplier_weight, scale_defender, scale_attacker, scale_ferry, emergency_value_cap

; ------------------------------------------------------------------
; Subject-matter groupings that predate the screen (unchanged)
; ------------------------------------------------------------------
;
; Every tunable constant belongs to exactly one of S/X/G/M: a knob in
; no block is a knob the campaign can never reach, which is how the first
; draft left settler_fearfulness_mult, diplomat_defence_value and the
; upkeep weights untunable -- the three the T76 Europe forensics
; implicate most (findings/europe-T76.md).
;
; The blocks are NOT independent: X and G spend the civilian budget, M
; spends the military one, and S sets the split between them. That is
; why S runs first and why --rounds > 1 exists; the alternation table
; tune.py prints is the evidence for whether the coupling bites.
;
; S/X/G/M partition the knobs; the composite blocks below overlap them
; on purpose. Two knobs sit in S and MIL and are spent on the ECON
; side: upkeep_gold_weight subtracts from every horizon credit
; (deephorizon.c) and survival_target gates whether that credit is paid
; at all. A campaign that tunes ECON without them is optimising a
; column whose tax it cannot touch -- the block-assignment error STATUS
; recorded once for survival_target and never fixed. They keep their
; single home in the four-way partition (S, where the split lives) and
; join the ECON composite that they tax.

; S -- the split: how much perceived threat becomes military want,
; and what a standing unit is charged for.
