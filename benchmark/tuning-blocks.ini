; Tuning blocks for tune.py --blocks (see findings/objective-layer.md).
;
; ==================================================================
; SCREENING TIERS -- read this before designing a campaign
; (2026-08-30, findings/knob-screen-2026-08-30.md)
; ==================================================================
;
; The 2026-08-23 tune-postfix campaign mutated ~80 constants at once
; against an 8-seed objective whose SE was ~41, and selected the max
; of ~40 unreplicated draws. The holdout rejected the result
; (findings/tune-postfix-verdict-2026-08-25.md). The zero-game knob
; screen then established WHY nothing could have been fit: of 277
; tunables, 163 (59%) cannot be shown to move a single logged
; decision in 40 games, and 89 of those sit on code that never ran.
; (166 and 92 before the 2026-08-30 corpus retake, which moved three
; military scale keys off the dead-path list -- see RESCREEN below.)
;
; The blocks below are cut by that evidence, not by subject matter.
; Three tiers:
;
;   TIER A -- fit directly. 18 continuous knobs, every one with a
;     validated replay rule in knobscreen.py and a MEASURED flip rate.
;     Blocks AUCTION (9) and DEFOPS (9). The cut is at the
;     domestic/military MERGE: AUCTION is the domestic side of that
;     comparison (the worker/founder/building bids and the horizon
;     anchor they are priced against), DEFOPS is the military side
;     (what produces a military want, and what that want is worth).
;     Was 11 knobs in blocks of 5 and 6 until the corpus retake
;     (findings/screen-corpus-2026-08-30.md) priced seven more.
;
;   TIER B -- group-screen, do not fit. The 28 highest-firing knobs
;     whose instrument runs but whose log carries only one side of
;     the comparison the knob enters, so a flip is not computable
;     offline. Blocks BFEAR (9), BASSAULT (6), BSITE (6), BCIVIL (7).
;     The question a tier-B block asks is "does this SUBSYSTEM move
;     score at all", answered in a handful of arms; only a block that
;     clears its own replicated test earns an individual pass. The
;     four horizon components used to head this ranking and have been
;     promoted out of it, so the top 28 by firing rate is now EXACTLY
;     these four blocks, name for name -- the five-way tie at 73.3
;     that used to straddle the cut now sits wholly inside, and the
;     first name outside is wrace_margin_turns at 69.7.
;
;   RESCREEN -- RETIRED, answered 2026-08-30. It named the 8 knobs the
;     deep-decay-sum / deep-bid milclass / deep-milcap instrumentation
;     made reconstructible offline. The corpus was retaken (the SAME
;     40 games, re-logged) and knobscreen.py priced all eight:
;     ALL EIGHT FLIP. Seven joined tier A, one went to tier C. The
;     block name still resolves; nothing should use it to plan a
;     campaign. See findings/screen-corpus-2026-08-30.md.
;
;   TIER C -- everything else: PINNED at compiled defaults, and named
;     as pinned in the campaign's own log. Tier C is not a block. It
;     is the complement of the above, it stays inside ALL so no knob
;     becomes unreachable by hand, and no campaign block contains it.
;
; Block width discipline: every block a campaign names must be no
; wider than its seed count, and `tune.py --dry-run` prints a NOTE
; when it is not. All six campaign blocks above are <= 10 constants,
; against the 20-seed venue benchmark/screen-campaign.sh uses. That
; cap is what forced tier A into two blocks rather than one: 18
; constants in one AUCTION would have been 18 against 20 seeds, the
; ratio the 2026-08-23 campaign died of.
;
; Block width does NOT change a campaign's cost. A block pass costs
; pop x gens x seeds games whatever it moves, so widening AUCTION
; from 5 to 9 bought four more fitted constants for zero games --
; `tune.py --dry-run` prints the same 1656 per stage-1 block pass.
;
; The old groupings below (S/X/G/M, ALL/ECON/MIL, DECAYTECH, the six
; G sub-blocks) are UNCHANGED and still resolve, so cached results and
; existing scripts keep working. They are subject-matter partitions
; from before the screen existed; prefer the tiers above for anything
; new.
;
; ------------------------------------------------------------------
; TIER A -- measured flip rates, fit directly
; ------------------------------------------------------------------
; flips/game on the 40-game corpus, in brackets. It is the SAME 40
; games throughout: benchmark/results/w25-screen-corpus is a
; byte-identical re-log of tune-postfix/s6-nogates-*, so the eleven
; original entries reproduce to the digit and the seven added ones
; are measured on the same games.

; AUCTION -- the DOMESTIC side of the city-turn build merge: the
; worker/founder/building bids, and the horizon anchor those bids are
; priced against. switch_cost_gain [274.7], scale_settler [114.2] and
; scale_worker [51.6] are the three prices on the auction itself.
; The anchor is upkeep_gold_weight [93.2], horizon_capacity_weight
; [11.2], and the four credit components deep-decay-sum separates:
; horizon_content_weight [753.2 -- the largest flip rate in the whole
; screen after garrison_floor_danger, a third of every credited
; improvement's argmax], horizon_multiplier_weight [144.6],
; horizon_bundle_weight [83.9], horizon_growth_weight [78.9].
AUCTION = switch_cost_gain, scale_settler, scale_worker, upkeep_gold_weight, horizon_capacity_weight, horizon_growth_weight, horizon_bundle_weight, horizon_content_weight, horizon_multiplier_weight

; DEFOPS -- the MILITARY side of the same merge: what produces a
; military want, and what that want is then worth.
; garrison_floor_danger [113.1], floor_sea_weight [63.4] and
; floor_border_weight [53.3] price the standing-garrison floor;
; expansion_war_survival [15.3], founder_pool_per_site [9.9] and
; op_take_target [4.9] are the three verdicts beside it; and
; scale_attacker [112.9], scale_defender [42.8], scale_ferry [16.2]
; rescale the resulting bid at the merge. Those three sit here rather
; than in AUCTION because scale_defender multiplies exactly the want
; garrison_floor_danger produced -- one lever applied twice, and a
; block boundary must not fall between them.
; The 2026-08-30 screen's "DEFENCE/OPS"; named DEFOPS because
; --blocks takes a comma list.
DEFOPS = garrison_floor_danger, floor_sea_weight, floor_border_weight, expansion_war_survival, founder_pool_per_site, op_take_target, scale_defender, scale_attacker, scale_ferry, garrison_floor_turn

; ------------------------------------------------------------------
; TIER B -- group screen: does this subsystem move score at all?
; ------------------------------------------------------------------
; Ranked by instrument firings per game, which is WEAKER evidence than
; a flip rate and must not be read as one. These blocks are screened
; as blocks; an individual knob inside one is never fit off a block
; result.

; BFEAR -- what perceived threat costs, and the ledger it is kept in.
BFEAR = garrison_menace_slope, menace_overseas_weight, satisfied_fear_discount, survival_target, survival_horizon, survival_fear_value, floor_interior_weight, floor_marines_mult, barb_size_ref_cities

; BASSAULT -- what a target is worth and what reinforcing it costs.
BASSAULT = conquest_worth_mult, attack_value_weight, attack_loss_gain, invasion_reinforce_rate, invasion_reinforce_slope, invasion_embark_turns

; BSITE -- site scoring and the travel price paid to reach one.
BSITE = site_stream_weight, site_potential_discount, site_potential_weight, site_settler_cost_weight, site_travel_discount, site_naval_weight

; BANTICIP -- what deep fears BEFORE anything has happened, and the
; price the fear pays for displacing a founder. S-FEARSEAT
; (2026-08-30) put every one of these on a seat that the deep-fear /
; deep-density / deep-shadow / deep-milopp census can read, but the
; comparison a flip needs -- the founder bid the defender displaced --
; is only half in the log, so this is a tier-B block: screened as a
; block, never fit off a block result. Seven constants against the
; 20-seed venue.
BANTICIP = density_fear_ramp_turns, fear_evidence_floor, density_fear_capability, mil_opportunity_price, boat_shadow_distance, boat_shadow_count, garrison_floor_turn

; BCIVIL -- civilian movement, the sea lift, exploration, fortifying.
BCIVIL = settler_fearfulness_mult, worker_flee_radius, worker_guard_radius, explore_explorer_claim, lift_op_slots, colony_lift_weight, base_fort_gain

; ------------------------------------------------------------------
; RESCREEN -- RETIRED. Answered 2026-08-30; kept as the record.
; ------------------------------------------------------------------
; These eight became reconstructible offline when deep-decay-sum
; started reporting bund/cont/mult/grow beside capadd, deep-bid
; started reporting milclass, and deep-milcap was added. The corpus
; was retaken -- the SAME 40 games, re-logged, byte-identical
; scorelogs on all 40 -- and knobscreen.py priced every one of them.
; ALL EIGHT FLIP. flips/game, and where each went:
;
;   horizon_content_weight       753.2   -> tier A, AUCTION
;   horizon_multiplier_weight    144.6   -> tier A, AUCTION
;   scale_attacker               112.9   -> tier A, DEFOPS
;   horizon_bundle_weight         83.9   -> tier A, AUCTION
;   horizon_growth_weight         78.9   -> tier A, AUCTION
;   emergency_value_cap           51.3   -> TIER C, pinned
;   scale_defender                42.8   -> tier A, DEFOPS
;   scale_ferry                   16.2   -> tier A, DEFOPS
;
; emergency_value_cap is tier C DESPITE flipping, and the reason is
; what its flip IS. The emergency_cap rule sees "the clamp engages",
; which is an input to a decision and not a decision; at the one
; comparison where a winner is logged -- the domestic/military merge
; -- the cap is still provably inert on 143k merges, because the
; merge is tier-first and a clamped emergency want outranks every
; domestic one regardless; and its default 0.0 sits at the bottom of
; its range, so -1 sigma clips back to 0 and the 51.3 is what
; turning the cap ON at 333 would clamp, not a gradient. That is the
; founder_tier_gate situation, and it gets the same answer: a gate
; A/B if anyone wants it, never a search dimension.
;
; The name still resolves. Nothing should plan a campaign with it.
; findings/screen-corpus-2026-08-30.md Part 1.
RESCREEN = horizon_growth_weight, horizon_bundle_weight, horizon_content_weight, horizon_multiplier_weight, scale_defender, scale_attacker, scale_ferry, emergency_value_cap

; ------------------------------------------------------------------
; Subject-matter groupings that predate the screen (unchanged)
; ------------------------------------------------------------------
;
; Every tunable constant belongs to exactly one of S/X/G/M: a knob in
; no block is a knob the campaign can never reach, which is how the first
; draft left settler_fearfulness_mult, diplomat_defence_value and the
; upkeep weights untunable -- the three the T76 Europe forensics
; implicate most (findings/europe-T76.md).
;
; The blocks are NOT independent: X and G spend the civilian budget, M
; spends the military one, and S sets the split between them. That is
; why S runs first and why --rounds > 1 exists; the alternation table
; tune.py prints is the evidence for whether the coupling bites.
;
; S/X/G/M partition the knobs; the composite blocks below overlap them
; on purpose. Two knobs sit in S and MIL and are spent on the ECON
; side: upkeep_gold_weight subtracts from every horizon credit
; (deephorizon.c) and survival_target gates whether that credit is paid
; at all. A campaign that tunes ECON without them is optimising a
; column whose tax it cannot touch -- the block-assignment error STATUS
; recorded once for survival_target and never fixed. They keep their
; single home in the four-way partition (S, where the split lives) and
; join the ECON composite that they tax.

; S -- the split: how much perceived threat becomes military want,
