; ---------------------------------------------------------------
; Composite blocks for the alternating campaign (human design
; 2026-08-01): one machine tunes ECON only; the other cycles
; ALL -> ECON -> MIL -> repeat, so a global re-centring pass is
; followed by focused refinement of each side.
;
; These OVERLAP the four blocks above on purpose -- they are
; alternative groupings of the same constants, not a second
; partition. Use one scheme or the other in a given run.
;
; NOTE on ALL: 81 dimensions is far more than a (mu,lambda) ES
; can search with a small population. It is a coarse re-centring
; pass, not a fine search -- give it the largest --pop the box
; affords, and expect ECON/MIL to do the real work.

