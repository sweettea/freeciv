; ---------------------------------------------------------------
; G sub-blocks (2026-08-21, the defaults-vs-pv3 autopsy). Round 1 of
; the ablation put the loss on G: on isolated-150, defaults-plus-G
; scored -53.8/seed against plain defaults (t -2.90, 1 win in 8)
; while the whole tuned package scored -98.8. G is 109 knobs, which
; is not an answer, so these six partition it EXACTLY -- every G knob
; is in one and only one of them, and their union is G.
;
