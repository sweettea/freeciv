; Tuning blocks for tune.py --blocks (see findings/objective-layer.md).
;
; Every tunable constant belongs to exactly one block: a knob in no
; block is a knob the campaign can never reach, which is how the first
; draft left settler_fearfulness_mult, diplomat_defence_value and the
; upkeep weights untunable -- the three the T76 Europe forensics
; implicate most (findings/europe-T76.md).
;
; The blocks are NOT independent: X and G spend the civilian budget, M
; spends the military one, and S sets the split between them. That is
; why S runs first and why --rounds > 1 exists; the alternation table
; tune.py prints is the evidence for whether the coupling bites.

; S -- the split: how much perceived threat becomes military want,
; and what a standing unit is charged for.
S = survival_fear_value, survival_target, survival_horizon, garrison_floor, garrison_floor_danger, garrison_menace_slope, menace_overseas_weight, barbarian_fear, boat_shadow_fear, density_fear_value, density_fear_radius, density_prior_value, overseas_fear, wall_fear_weight, satisfied_fear_discount, upkeep_gold_weight, upkeep_unit_weight, diplomat_defence_value, incoming_defence_eta_weight, incoming_defence_survival

; X -- expansion: where the empire goes and what it pays to get there.
; settler_fearfulness_mult and settler_risk_tolerance sit here because
; T76 showed deep's founder want firing in 12% of cities against
; stock's 41%: risk-priced travel is a prime suspect for suppressing it.
X = settler_fearfulness_mult, settler_risk_tolerance, settler_rush_weight, site_tail_weight, site_depth_weight, site_potential_discount, site_overlap_weight, site_claim_bonus, site_pressure_factor, site_special_bonus, site_special_cluster, site_choke_bonus, colony_lift_weight, density_fear_ramp_turns, density_prior_tiles, overseas_decay

; G -- growth: buildings, citizen management, worker safety. What the
; civilian budget buys once the sites are chosen.
G = horizon_capacity_weight, horizon_growth_weight, horizon_bundle_weight, horizon_tech_weight, horizon_health_weight, horizon_content_weight, horizon_multiplier_weight, cm_war_survival, cm_happy_factor, cm_grow_food, cm_grow_shield, cm_grow_trade, cm_grow_below, cm_grow_safety_margin, cm_trade_quality_slope, cm_cap_food, cm_cap_shield, cm_cap_trade, cm_wonder_shield, cm_wonder_trade, rotation_power_ratio, rotation_want, rotation_finish_relax, worker_flee_radius, worker_guard_radius, worker_danger_discount, embassy_science_value, explore_hut_value, explore_discovery_value

; M -- military allocation: how the war budget is spent.
M = op_take_target, op_abort_floor, op_muster_wait, op_wave_window, invasion_reinforce_rate, barb_reinforce_rate, raid_radius, attack_value_weight, sortie_win_floor, sortie_defence_weight, tired_attack_floor, committed_fear_mult, convoy_min_load, convoy_wait_radius, cm_war_food, cm_war_shield, cm_war_trade, hut_risk_radius, hut_risk_discount

; ---------------------------------------------------------------
; Composite blocks for the alternating campaign (human design
; 2026-08-01): one machine tunes ECON only; the other cycles
; ALL -> ECON -> MIL -> repeat, so a global re-centring pass is
; followed by focused refinement of each side.
;
; These OVERLAP the four blocks above on purpose -- they are
; alternative groupings of the same constants, not a second
; partition. Use one scheme or the other in a given run.
;
; NOTE on ALL: 81 dimensions is far more than a (mu,lambda) ES
; can search with a small population. It is a coarse re-centring
; pass, not a fine search -- give it the largest --pop the box
; affords, and expect ECON/MIL to do the real work.

