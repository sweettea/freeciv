; Tuning blocks for tune.py --blocks (see findings/objective-layer.md).
;
; The blocks are NOT independent: E and M bid for one shield budget and
; S sets how much of it fear claims, which is why S runs first and why
; --rounds > 1 exists. The alternation table tune.py prints at the end
; is the evidence for whether that coupling actually bites.

; S -- the split: how much perceived threat becomes military want.
S = survival_fear_value, survival_target, garrison_floor_danger, garrison_menace_slope, barbarian_fear, boat_shadow_fear, density_fear_value, overseas_fear, wall_fear_weight, satisfied_fear_discount

; E -- economic allocation: how the civilian budget is spent.
E = site_tail_weight, site_depth_weight, site_potential_discount, site_claim_bonus, site_pressure_factor, horizon_capacity_weight, horizon_growth_weight, horizon_bundle_weight, horizon_tech_weight, settler_rush_weight, colony_lift_weight, cm_grow_food, cm_grow_shield, cm_grow_trade

; M -- military allocation: how the war budget is spent.
M = op_take_target, op_abort_floor, op_muster_wait, op_wave_window, invasion_reinforce_rate, raid_radius, attack_value_weight, sortie_win_floor, sortie_defence_weight, tired_attack_floor, committed_fear_mult
