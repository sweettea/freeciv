[tuning]
; ERA phase 3a, arm A' (2026-08-12): era-a-pv1.ini plus the one knob.
;
; The pre-registered A/B of findings/era-probe-evidence-2026-08-12.md
; section 6 ("The A/B that would prove 3a"). Arm A is era-a-pv1.ini
; verbatim; this file is that file byte-for-byte with
; op_draft_marginal = 1 appended, so the only difference between the
; arms is the garrison draft's release test: an absolute
; survival_target floor (A) against the marginal comparison between
; the survival a blade costs its city and the take-probability it buys
; the operation (A').
;
; Copied rather than referenced for the same reason arm A is: the
; result cache is keyed on this file's sha256, and the arm's identity
; must not move if era-a-pv1.ini is ever revised.
;
; expansion_war_survival is deliberately ABSENT, as in arm A and in
; principled-v1: the compiled default 0.9 applies.
caravan_discount = 0.958333
survival_target = 0.85
op_take_target = 0.65
op_abort_floor = 0.3
invasion_reinforce_rate = 0.2
settler_fearfulness_mult = 1.5
diplomat_defence_value = 225.0
cm_grow_below = 8
cm_grow_safety_margin = 1.5
worker_danger_discount = 2.0
explore_hut_value = 50.0
explore_discovery_value = 0.3
endgame_horizon = 1
op_draft_marginal = 1
