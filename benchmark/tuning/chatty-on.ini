; CHATTY ON arm: the ally-corridor background (tuning/w12-ally-on.ini,
; copied verbatim) plus the chat gate and its rate cap.
;
; The corridor knobs are here because one of the four message classes
; is ABOUT ally corridors, and a corridor that is never planned cannot
; be announced. They are slice 1's and slice 2's untuned probe values
; and carry no claim; they are the background the liveness proof needs
; in order to have something to be live about.
;
; chatty_gate = 1 opens the channel. chatty_max_per_turn = 3 is the
; compiled placeholder, restated here so the smoke's own log lines
; witness the value the run used -- the deep-tuning read-back line
; truncates around 4 140 characters and a knob appended at the end of a
; long file falls off it, so `said=n/3` on a deep-chat line is the
; provenance for this pair.
[tuning]
worker_travel_discount = 1.0
trunk_road_gain = 5.0
trunk_source_gain = 1.0
trunk_ally_gate = 1
chatty_gate = 1
chatty_max_per_turn = 3
