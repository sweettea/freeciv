; informed-v1 -- ONE stacked candidate arm (2026-10-28). NOT a default.
;
; Every value below is a hypothesis derived from a measurement or a rules
; fact, never from taste; the derivation for each line is in
;   doc/deep-ai/findings/informed-values-2026-10-28.md
; (per-knob sections, verbatim labels; table C is this file).
;
; Compare against: compiled defaults + the five S-STACKED gates
; (benchmark/tuning/stacked-on.ini). Primary meter cities/seat;
; unitslost is the falsification; score secondary; plus the T50/T100
; panel (benchmark/panel.py). n = 100 training seeds, both venues.
; Pre-registered: cities/seat at T150 +0.25..+0.70 vs the control on
; contested (audit: ~80% of that is the floor term, whose anchor arm ran
; without the opportunity charge and never on contested -- a result of
; +0.10..+0.25 is NOT a falsification; below +0.10 is); unitslost flat or down; units/city at T50 1.00 -> 0.5-0.7;
; gold at T100 39 -> 100-200. Bisection halves H-DEF / H-ECON in memo C.
;
; Only knobs that CHANGE are listed; every other knob is the compiled
; default. The five gates are on in this arm AND in the control.
[tuning]
mil_opportunity_gate = 1          ; S-STACKED gate (control also 1)
founder_site_cap_gate = 1         ; S-STACKED gate (control also 1)
founder_join_guard_gate = 1       ; S-STACKED gate (control also 1)
frontier_transit_gate = 1         ; S-STACKED gate (control also 1)
boat_shadow_gate = 1              ; S-STACKED gate (control also 1)
founder_floor_gate = 0            ; excluded from the stack (-10.17 +/- 1.38); stays 0 as in control

; --- H-DEF: the defence seam ---
garrison_floor_danger = 0         ; anchor (e)+(b): floor ON measured -1.09 cities (t -2.77, isolated-150) and -0.66 (t -4.16, lategame-80), n=20 each; baseline 0.33 units/city at T50. Empty-city want is a switch, so 0 is the OFF position. Alternative rung: garrison_floor_turn=120.
scale_defender = 0.5              ; AUDIT: UNVERIFIABLE -- assumes halving the want halves the unit count, which nothing measures; a labelled guess, not an anchor. anchor (b): baseline-matching units/city (military ~3.0 vs 2.1 per city at T150); NORMAL tier only. Exchange-rate derivation says 0.1-0.2 (next rung).
mil_opportunity_price = 2.0       ; anchor (d)+(a): founder d beats first defender iff d > (1100+div)/(1+p); range max 2.0 admits bids >= 367 want; price list >= 6 pts/city vs defender ~0; fearseat unitslost flat at 1.0.

; --- H-ECON: supply and the gold bill ---
; frontier_transit_price stays at compiled 1.0: the proposed 0.0 was DROPPED by the audit
; (cancelling peace is immediate war, common/player.c:79; the 16 turns is the ceasefire
; countdown; and the price is a pathfinding cost that never reaches site valuation).
upkeep_gold_weight = 0.75         ; anchor (c): stock prices building gold upkeep at gold_priority = TRADE_WEIGHTING = 18 want/gold-turn (daicity.c:1490,1508; advdata.c:518); deep's debit is gold x dk_bdur(24) x w -> w = 18/24.
founder_site_cap_slack = 0.0      ; anchor (d): deep_remaining_sites() reads ~3.3 when 97.2% of searches are empty (city ledger s5) -> the estimator already carries the walking-founder allowance; 1.0 double-counts it.
cm_founder_food = 1.0             ; AUDIT-CORRECTED from 2.0: the knob fires only while food surplus < founder upkeep and is released the next turn surplus meets it (deepcm.c:763,:435), so it cannot hold a regrowth surplus; the veto it clears is surplus >= upkeep (deepdefence.c:8298), which k = 1 satisfies. Liveness data exists only at 1.0.
