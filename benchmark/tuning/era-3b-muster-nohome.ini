[tuning]
; ERA phase 3b, the MUSTER arm (2026-08-12): fact-c01.ini plus one knob.
;
; The baseline is pv1 + survival_pf_reach = 1 -- NOT pv2. The reach
; correction's +71.9/seed on the pv1 base does not transfer to the tuned
; ECON baseline (STATUS 2026-08-12, G4/G5: +2.8/seed, t +0.04), so the
; war-venue evidence lives on pv1+reach and that is where a war-venue
; mechanism has to be read. fact-c01.ini is that baseline; this file is
; fact-c01.ini byte-for-byte with op_muster = 1 appended, so the only
; difference between the arms is whether a slot whose target clears the
; worth gate may enter MUSTER with the odds refused.
;
; op_muster_stall is deliberately ABSENT: the compiled default 10 is a
; flagged PLACEHOLDER and pinning it here would dress it as a decision.
;
; op_draft_marginal stays 0 in BOTH arms (3a was falsified and is
; score-null), and cover_removal stays 0 in both -- it moves the
; muster's home-defence cost side and the garrison draft's at the same
; time, so it is a factorial arm of its own and not a passenger here.
caravan_discount = 0.958333
survival_target = 0.85
op_take_target = 0.65
op_abort_floor = 0.3
invasion_reinforce_rate = 0.2
settler_fearfulness_mult = 1.5
diplomat_defence_value = 225.0
cm_grow_below = 8
cm_grow_safety_margin = 1.5
worker_danger_discount = 2.0
explore_hut_value = 50.0
explore_discovery_value = 0.3
endgame_horizon = 1
survival_pf_reach = 1
op_muster = 1
op_muster_home = 0
