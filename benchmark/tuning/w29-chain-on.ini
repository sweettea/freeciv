; W29 ON arm: the terrain-chain valuation, and nothing else.
;
; One key, and it is a GATE with no companion magnitude: above it a
; cultivate or plant candidate is priced by the best terrain the
; cultivate/plant graph reaches from that tile, amortized over the turns
; beyond the first step, in the advisor's own city_tile_value()
; currency. There is no weight to set because there is no free
; parameter -- the price is the advisor's function and the chain length
; is the ruleset's activity times.
;
; The OFF arm for any comparison against this file is the SAME file with
; the key at 0, or no tuning file at all: every other value deep runs is
; its compiled default in both arms, so the difference between them is
; this mechanism and not a background.
[tuning]
terrain_chain_gate = 1
