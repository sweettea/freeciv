; Combat E2, the cost-of-victory term ALONE: the assault want pays for
; the losses it expects to take, and nothing else in the epic is live.
; NOTE: float keys MUST carry a decimal point. secfile stores `0` as
; an INT entry and secfile_lookup_float_default() then falls back to the
; compiled default, silently. That cost this session a 40-game arm.
[tuning]
pay_switch_penalty = 1
switch_cost_price = 1
attack_loss_gain = 1.0
assault_pool_reach = 0
op_launch_odds = 0
tired_attack_floor = 0.0
