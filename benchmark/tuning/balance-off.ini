; BALANCE control arm: every lever this session adds, off -- which is
; also the compiled default, so this file is the explicit control
; rather than a change. The switch-penalty posture is PINNED to the
; compiled defaults so no arm differs in HEDGE's handicap.
; NOTE: float keys MUST carry a decimal point -- secfile stores `0` as
; an INT entry and the loader then falls back to the compiled default.
[tuning]
pay_switch_penalty = 1
switch_cost_price = 1
conquest_culture_gain = 0.0
gift_border_value = 0.0
gift_love_gain = 0.0
proxy_arm_gain = 0.0
