; S-FRONTIER cell c01 -- the founder floor. An empty site search whose
; failure a turn could undo (deep_site_blocked_seen_turn(), the same
; signal founder_join_guard reads on the consumption side) decays the
; founder want instead of zeroing it, bounded by deep_remaining_sites()
; so an empty search on a genuinely full map still zeroes it exactly as
; today. founder_floor_want 1.0 and founder_floor_reach_ref 1.0 are
; PLACEHOLDER and are not swept here.
[tuning]
frontier_transit_gate = 0
founder_floor_gate = 1
founder_floor_want = 1.0
founder_floor_reach_ref = 1.0
