; ERA probe, arm B (2026-08-11): arm A with deep's expansion gate off.
;
; era-a-pv1.ini plus the ONE line below. expansion_war_survival = 0.0
; is the documented stock-restore value, not a guess:
; deep_expansion_blocked() returns dai_on_war_footing() unchanged when
; the knob is <= 0 (deepdefence.c:3657 comment, "expansion_war_survival
; <= 0 restores stock's behaviour exactly"). So arm B is deep with
; stock's expansion gate, and A minus B is what deep's replacement gate
; is worth on tech50war-200 -- the mechanism the 2026-08-11 forensics
; ranks second (~20-40 of the 351-point gap).
;
; Not a tuning value and not to be tuned: it is the gate's off switch.
