; W12 slice 3 ON arm: slice 2's ON file unchanged, plus the ally gate.
; Differs from tuning/w12-source-on.ini in exactly ONE key, so a
; comparison between the two files reads the ally node set alone.
;
; worker_travel_discount = 1.0, trunk_road_gain = 5.0 and
; trunk_source_gain = 1.0 are slice 1's and slice 2's untuned probe
; values, carried over verbatim; they carry no claim here either, they
; are the shared background both arms stand on. trunk_road_gain > 0 is
; what makes a plan exist at all and trunk_source_gain > 0 is what
; dispatches a worker to a corridor tile outside every own city
; radius -- an ally corridor is nearly always entirely outside them,
; so without slice 2 the gate would plan links nobody walks to.
;
; trunk_ally_gate = 1 is geometry, not a magnitude: the node set either
; contains allied cities or it does not. The knob ships at 0 and is
; registered PLACEHOLDER.
[tuning]
worker_travel_discount = 1.0
trunk_road_gain = 5.0
trunk_source_gain = 1.0
trunk_ally_gate = 1
