; Europe legibility game seat: Deep_Osmanli -- group informed, stance preset 2 (0 BALANCED, 1 ECONOMIC, 2 MILITARY).
; Per-seat file for the FREECIV_DEEP_ARENA manifest; carries the WHOLE vector because a seat
; file overlays compiled defaults, not the base tuning. Generated 2026-10-28 from benchmark/tuning/informed-v1-classic.ini.
[tuning]
mil_opportunity_gate = 1          ; S-STACKED gate (as in informed-v1)
founder_site_cap_gate = 1         ; S-STACKED gate
founder_join_guard_gate = 1       ; S-STACKED gate
frontier_transit_gate = 1         ; S-STACKED gate
boat_shadow_gate = 1              ; S-STACKED gate
founder_floor_gate = 0            ; held at 0 as in informed-v1
garrison_floor_turn = 60          ; CLASSIC-SPECIFIC (replaces informed-v1's garrison_floor_danger=0): classic onsetbarbs is T60 (civ2civ3 T120) and an unwalled classic city is .94 to a Catapult (theory s.E), so the token garrison's measured opening cost is taken (floor off T1-59) and the floor returns when the threat the ruleset schedules arrives. garrison_floor_danger stays at compiled 40. Caveat: techlevel 20 puts Catapults on the board from T1, so the human may see this fail early -- that is what a legibility game is for.
scale_defender = 0.5              ; AUDIT: UNVERIFIABLE -- assumes halving the want halves the unit count, which nothing measures; a labelled guess, not an anchor. KEPT; anchor was a civ2civ3 panel measurement (units/city) with no classic counterpart; held for comparability with informed-v1, and the exchange-rate direction (marginal defender net <= 0) is ruleset-invariant in sign. Classic unit upkeep is shields (3 free), not gold, so the cost side is smaller: if anything the classic value is higher, not lower.
mil_opportunity_price = 2.0       ; INVARIANT: the 750.075 clamp and the 1100 first-defender want are ai/default constants, not ruleset values.
upkeep_gold_weight = 0.75         ; INVARIANT: gold_priority = TRADE_WEIGHTING = 18 is advisor code; classic buildings pay gold upkeep the same way (Aqueduct 2 gold).
founder_site_cap_slack = 0.0      ; KEPT: anchor was the estimator's late-game bias (civ2civ3 ledger); classic citymindist 2 makes deep_remaining_sites() larger, so the cap binds less and the slack matters less -- the same direction.
cm_founder_food = 1.0             ; AUDIT-CORRECTED from 1.5: the knob fires only while food surplus < founder upkeep and is released the next turn surplus meets it (deepcm.c:763,:435), so it cannot hold a regrowth surplus; the veto it clears is surplus >= upkeep (deepdefence.c:8298), which k = 1 satisfies. Liveness data exists only at 1.0.
stance_forced = 2                ; personality pinned per seat (deepstance.c: ECONOMIC econ=1+span mil=1-span; MILITARY the reverse)
