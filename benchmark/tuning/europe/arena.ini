; Europe legibility game: which deep seat runs which file (FREECIV_DEEP_ARENA).
; Lookup is by player name (ai/deep/deeptuning.c deep_arena_seat_file). Seats
; not listed run the base FREECIV_DEEP_TUNING (unset here -> compiled defaults).
; Paths are ABSOLUTE because the server runs with cwd = the play directory.
;
; Every nation here is in europe.sav's start-position table, so its seat is
; FIXED (server/gamehand.c assigns a tagged position only to a matching
; nation; hellenic/iberian/norwegian were NOT in the table and floated).
; Pairs are matched by geography so the A/B is as fair as the map allows:
;   A informed-v1-classic                 B control (gates only)
;   Deep_Rus      ECONOMIC  russian  <->  Deep_Ukraina  ECONOMIC  ukrainian   eastern interiors
;   Deep_Osmanli  MILITARY  turkish  <->  Deep_Hellas   MILITARY  greek       Aegean, face to face
;   Deep_Gallia   BALANCED  french   <->  Deep_Germania BALANCED  german      big interiors
;   Deep_Anglia   ECONOMIC  english  <->  Deep_Dania    ECONOMIC  danish      northern maritime
;   Deep_Hispania MILITARY  spanish  <->  Deep_Italia   MILITARY  italian     Mediterranean peninsulas
; Stock classic: Polska, Hungaria, Austria, Carthago. Human: any table nation (Scottish, Icelandic,
; Portuguese, Irish, Swedish ... all fixed). Keep the personality mix matched across groups.
[arena]
