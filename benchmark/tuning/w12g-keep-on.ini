; W12G ON arm: tuning/w12-div-on.ini unchanged, plus the two
; keepable-bid gates. Differs from that file in exactly TWO keys, so a
; comparison between the two reads what the gates do to the corridor
; family AS MEASURED -- the arm to beat is the family running with its
; leak, not the family switched off.
;
; worker_travel_discount = 1.0, trunk_road_gain = 5.0,
; trunk_source_gain = 1.0, trunk_ally_gate = 1 and trunk_trade_gain =
; 1.0 are slices 1-4's untuned probe values, carried over verbatim from
; tuning/w12-div-on.ini. They carry no claim here; they are the shared
; background both arms stand on.
;
; trunk_keepable_gate = 1 is geometry, not a magnitude: the corridor
; source either measures its bid against the unit's own site value
; before making it or it does not. There is nothing to tune.
;
; trunk_keep_margin = 0.25 IS a magnitude and it is a PROBE, not a
; result. No derivation fixes it -- unlike trunk_trade_gain's unit
; case, the sunk walk has no natural denomination in the advisor's tile
; currency, and the knob ships at 0.0 registered PLACEHOLDER. 0.25 says
; "a rival must be worth a quarter more before a half-finished walk is
; abandoned". It carries no claim beyond being far enough from 0 for
; the mechanism to fire and far enough from the 2.0 range ceiling not
; to pin a worker to a tile it can never reach. It owes a tuning pass
; and STATUS says so.
[tuning]
worker_travel_discount = 1.0
trunk_road_gain = 5.0
trunk_source_gain = 1.0
trunk_ally_gate = 1
trunk_trade_gain = 1.0
trunk_keepable_gate = 1
trunk_keep_margin = 0.25
