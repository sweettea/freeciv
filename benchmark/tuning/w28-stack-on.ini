; W28 ON arm: tuning/w12g-keep-on.ini unchanged, plus the corridor
; stacking gate. Differs from that file in exactly ONE key, so the
; comparison reads what letting a corridor task join an occupied
; worksite does to the corridor family AS IT NOW STANDS -- W12 slices
; 1-4 plus W12G's two keepable-bid fixes, which is the arm every
; corridor number since 2026-08-22 was taken on.
;
; worker_travel_discount = 1.0, trunk_road_gain = 5.0,
; trunk_source_gain = 1.0, trunk_ally_gate = 1, trunk_trade_gain = 1.0,
; trunk_keepable_gate = 1 and trunk_keep_margin = 0.25 are carried over
; verbatim from tuning/w12g-keep-on.ini. They carry no claim here; they
; are the shared background both arms stand on.
;
; trunk_stack_gate = 1 is geometry, not a magnitude: the source either
; prices an occupied corridor tile or skips it, and the price itself is
; the advisor's own marginal-completion formula with nothing free in
; it. There is nothing here to tune and the knob owes no tuning pass.
[tuning]
worker_travel_discount = 1.0
trunk_road_gain = 5.0
trunk_source_gain = 1.0
trunk_ally_gate = 1
trunk_trade_gain = 1.0
trunk_keepable_gate = 1
trunk_keep_margin = 0.25
trunk_stack_gate = 1
