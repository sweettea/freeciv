; Garrison floor OFF, for the sizing A/B (session G1).
;
; The off-switch is garrison_floor_danger, not garrison_floor: the
; latter is also read by deep_fear_satisfaction() (a garrison below it
; keeps every injected fear at full strength) and by the melt, so
; zeroing it would move three mechanisms at once. Zeroing the injected
; danger leaves the floor eligible -- the deep-floor census still emits
; the city-turn -- and injects nothing, so the arm is proven by
; `applied == 0` on every line.

[tuning]
garrison_floor_danger = 0
