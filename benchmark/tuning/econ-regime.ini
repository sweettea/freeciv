; ECONOMY REGIME: deep's military surcharge switched off, so the
; economy constants can be tuned without the war knobs competing for
; the same shield budget (findings/objective-layer.md -- the
; tuning-file approximation of a forced ECONOMIC objective, available
; before the objective layer itself exists).
;
;   tune.py --start benchmark/tuning/econ-regime.ini --blocks E ...
;
; --start is required: without it every constant begins at its
; compiled default and these zeros drift back up during the run.
;
; NOTE what this does NOT do. Deep only ADDS fear on top of stock's
; assess_danger(); zeroing these removes deep's surcharge, not the
; stock military layer underneath. The regime is "deep without its
; extra fear", which is exactly the comparison economy tuning wants.
;
; survival_target is deliberately left at its default: it gates the
; defence counter-claim, which satisfies danger by MOVING an existing
; blade rather than BUYING one. Free defence is economic policy and
; belongs in the economy regime; only the purchases are switched off.
[tuning]
; Hard off-switches (the code returns early at <= 0).
op_take_target = 0.0
raid_radius = 0
attack_value_weight = 0.0
; Injected fear magnitudes: what turns threat into production.
survival_fear_value = 0.0
barbarian_fear = 0
boat_shadow_fear = 0
density_fear_value = 0
density_prior_value = 0
overseas_fear = 0.0
wall_fear_weight = 0.0
garrison_floor = 0
garrison_floor_danger = 0
garrison_menace_slope = 0.0
