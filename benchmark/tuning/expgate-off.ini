[tuning]
; The never-block arm of the expansion gate: identity plus ONE key.
;
; deep_expansion_blocked() has had two regimes since it landed --
; deep's survival gate (expansion_war_survival > 0) and stock's
; dai_on_war_footing() (expansion_war_survival <= 0) -- and no way to
; ask for no gate at all. The ERA probe priced the first against the
; second (+149/seed for deep's, findings/era-probe-evidence-2026-08-
; 12.md S4) and closed with the corner it could not reach: what a
; world with NO gate scores. This file is that corner.
;
; expansion_gate_enabled = 0 makes the gate FALSE on every city-turn
; whatever expansion_war_survival says, so war never stops a city
; planning settlers and workers. The gate still logs (deep-expgate
; wave=-2), so the arm keeps `stock_blocked` and both wants and stays
; priceable against the other two.
;
; Not a tuning value and not to be tuned: it is an experiment arm, and
; its range in tuning-params.ini is degenerate so the tuner cannot
; reach it. To run the third arm on top of a real tuning file, append
; this one key to a copy of that file rather than using this one.
expansion_gate_enabled = 0
