; working. The cap itself is proved separately by said=n/12 never
; exceeding its own denominator.
;
; chatty_inbound_gate = 1 is this slice's gate. The four prices are the
; compiled PLACEHOLDERS restated here so the run's own key.txt witnesses
; the values it used.
