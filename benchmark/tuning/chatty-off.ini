; CHATTY OFF arm: tuning/chatty-on.ini with the two chatty keys removed
; and nothing else changed, so a comparison between the two files reads
; the chat channel alone.
;
; This is the control for the no-perturbation claim: the same corridor
; background, the same seeds, the same binary, deep silent. If a
; scorelog from this file differs from its chatty-on twin, then a
; message moved the game and the channel is not output-only.
[tuning]
worker_travel_discount = 1.0
trunk_road_gain = 5.0
trunk_source_gain = 1.0
trunk_ally_gate = 1
