; W12H arm 3: tuning/w12h-soft-on.ini unchanged, plus the risk term.
; ONE key apart from that file, so what separates this arm from the
; soft arm is the corridor's edge cost and nothing else.
;
; trunk_risk_weight = 0.1 is a PROBE, not a result. The knob ships at
; 0.0 as registered PLACEHOLDER and owes a tuning pass; nothing in the
; tree measures what a point of deep's standing fear is worth in move
; fragments. 0.1 is chosen only to be readable at both ends of the
; comparison it has to survive: a corridor step's terrain cost is 3-9
; move fragments (movement_cost 1-3 times SINGLE_MOVE), and the fear a
; borderland tile carries runs to tens (boat_shadow_fear alone ships at
; 25), so at 0.1 a badly exposed tile costs a couple of fragments more
; than a safe one -- enough to lose a tie, not enough to send a corridor
; the long way round the map. It carries no claim beyond that.
[tuning]
worker_travel_discount = 1.0
trunk_road_gain = 5.0
trunk_source_gain = 1.0
trunk_ally_gate = 1
trunk_trade_gain = 1.0
trunk_keepable_gate = 1
trunk_keep_margin = 0.25
trunk_soft_border_gate = 1
trunk_risk_weight = 0.1
