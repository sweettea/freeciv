; op-arrival factorial (findings/op-exchange-rate-2026-08-29.md section 9).
;
; Three gates on ONE causal chain -- they all move which waves fight --
; so they are read as one 2x2x2 factorial and never as three A/Bs
; (CLAUDE.md, "Parallelise scheduling, not attribution").
;
;   A  op_arrival_gate         price the journey: decay, eta cap, loss
;   P  op_patience_odds_floor  the half-quorum release must clear odds
;   R  op_regate_gate          the march re-gate remembers the march
;
; Cell names are APR in that order. 000 is the CONTROL: compiled
; defaults exactly, which is the tuning s6-nogates-war ran, so the
; control arm IS the corpus the finding was measured on. Every cell
; loads a file, so "a file was loaded" is never a second difference
; between arms.
;
; EVERY VALUE BELOW IS DERIVED FROM THE CENSUS, NOT CHOSEN (rule 7).
; The derivations, once:
;
;   op_launch_eta_cap = 4  -- refuse eta >= 5. The pre-registered
;       falsification: 117 launches at eta >= 5 produced ZERO contacts
;       and ZERO cities, so this cell must lose nothing.
;   op_arrival_decay = 0.447 -- the decay that reproduces the POOLED
;       arrival rate at the POOLED mean launch eta. Contacts/launches
;       = 39/501 = 0.078; the mean launch eta over the four corpora's
;       histogram (30 at 0-1, 205 at 2, 149 at 3-4, 117 at 5+) is
;       3.17; 0.078 = d^3.17 gives d = 0.447.
;   op_march_loss_rate = 0.56 -- members lost per turn of eta. The
;       deep-employop ledger books 1.78 members per closed operation
;       dead in transit; 1.78 / 3.17 = 0.56.
;   op_patience_odds_floor = 0.35 -- STRUCTURAL, not fitted: it is
;       op_abort_floor. A wave launched below the floor its own first
;       march turn will re-gate it against has made launch and abort
;       the same decision one turn apart.
;   op_regate_sunk_gain = 1.0 -- the unit case: credit the whole
;       fraction of the journey already covered.
;   op_regate_eta_freeze = 1 -- a switch, not a magnitude.
;
; All of them remain PLACEHOLDER and are flagged in STATUS.md for a
; tuning pass. What this factorial adjudicates is the GATE DEFAULT,
; not the values.
;
; --- cell 001 ---
[tuning]
op_regate_gate             = 1
op_regate_sunk_gain        = 1.0
op_regate_eta_freeze       = 1
