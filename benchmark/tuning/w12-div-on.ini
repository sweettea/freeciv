; W12 slice 4 ON arm: slice 3's ON file unchanged, plus the corridor
; trade dividend. Differs from tuning/w12-ally-on.ini in exactly ONE
; key, so a comparison between the two files reads the dividend's
; MARGINAL effect on top of the arm slice 3 measured -- which is the
; arm to beat, not the plain source arm.
;
; worker_travel_discount = 1.0, trunk_road_gain = 5.0,
; trunk_source_gain = 1.0 and trunk_ally_gate = 1 are slices 1-3's
; untuned probe values, carried over verbatim. They carry no claim
; here; they are the shared background both arms stand on.
;
; trunk_trade_gain = 1.0 is the UNIT case, not a chosen magnitude: the
; dividend is denominated in deeptrade's own route-value units, divided
; by MORT to turn that stock into a per-turn flow and multiplied by
; TRADE_WEIGHTING to price the flow the way city_tile_value() prices a
; tile's trade. 1.0 says "a corridor is worth the trade it unlocks, at
; face value". The knob ships at 0.0 and is registered PLACEHOLDER.
[tuning]
worker_travel_discount = 1.0
trunk_road_gain = 5.0
trunk_source_gain = 1.0
trunk_ally_gate = 1
trunk_trade_gain = 1.0
