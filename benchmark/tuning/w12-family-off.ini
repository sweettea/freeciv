; The W12 corridor family switched OFF, stated key by key.
;
; The counterpart to tuning/w12-div-on.ini, which carries all five of
; W12's knobs at the probe values slices 1-4 measured. This file names
; the same five keys at their COMPILED SHIPPING values, so the pair
; differs in exactly the family and in nothing else, and the
; `deep-tuning file="..."` read-back audit is symmetric across the two
; arms -- an empty file would have been the same game, but the audit
; could then only say "no overrides" rather than "these five, at zero".
;
; Every value here is read off deeptuning.c's default table (lines
; 146-150), not chosen: worker_travel_discount 0.0, trunk_road_gain
; 0.0, trunk_source_gain 0.0, trunk_ally_gate 0, trunk_trade_gain 0.0.
; All five are registered PLACEHOLDER and all five ship off, so this
; arm is the shipping AI.
[tuning]
worker_travel_discount = 0.0
trunk_road_gain = 0.0
trunk_source_gain = 0.0
trunk_ally_gate = 0
trunk_trade_gain = 0.0
