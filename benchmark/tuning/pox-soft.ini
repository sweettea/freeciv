; S-POX soft-personality arm: the same derived price and axis as
; pox-on.ini with the coupling exponent DERIVED rather than left at its
; placeholder.
;
; pox-on.ini's stance_pox_gain = 1.0 makes the multiplier expand^-1,
; which at the shape axis's observed floor (expand 0.22 on this venue,
; span 0.9) is 4.5x. A builder seat then charges 33.2 * 10 shared tiles
; * 4.5 = 1494 want against a median site worth 536.7, so every
; overlapped candidate lands on the MAX(0, total) clamp and the
; evaluator stops RANKING sites and starts tying them. Measured: the
; share of scored candidates that go non-positive rises 0.0% (off) ->
; 3.8% (flat) -> 7.3% (on).
;
; The bound that avoids it, at the observed extreme:
;   mult_max = 536.7 / (33.2 * 10)      = 1.617
;   gain     = ln(1.617) / ln(1 / 0.22) = 0.317
[tuning]
stance_source = 1
stance_trait_span = 0.9
site_own_overlap = 33.2
stance_pox_gain = 0.317
