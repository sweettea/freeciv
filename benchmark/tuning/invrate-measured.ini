; INVASION-RATE test arm: reinforcement IS production.
;
; The flat term off, the slope at its dimensional identity point, so
; the model charges exactly what the target city can measurably build
; per turn and nothing else.
;
; WHY THIS ARM RATHER THAN slope-ON-TOP-OF-flat. The probe answered it
; before the A/B could. robs= on deep-kill is the observed rate, and
; the shipped flat 0.34 sits well above the middle of it -- smoke,
; 5 493 observations over completed games (benchmark/reinforce.py):
;
;   all      mean 0.207  median 0.200  p90 0.350  max 0.500
;   sea=1    mean 0.196  median 0.200  p90 0.300  max 0.450
;   fraction where the target out-builds what the model charged:
;     0.144 overall, 0.081 on the invasion wants
;
; CORRECTION, recorded rather than quietly fixed: the first version of
; this file said "0 of 1 036 above 0.34, the flat rate is above the
; ENTIRE distribution". That was one partially-played seed, and it was
; the project's own declaring-on-insufficient-data failure mode. On
; finished games 14.4% of observations DO exceed 0.34. The argument
; survives with a smaller claim: the flat rate is ~1.7x the median
; city's real build rate and over-charges ~86% of the time, so it is a
; biased constant rather than a universally wrong one.
;
; That still makes `rate + 1.0 x observed` the wrong contrast -- it can
; only ask "does deep fear garrisons MORE", which nothing in the
; campaign asked. The contrast worth 32 games is between two whole
; models:
;
;   control (tuning/identity.ini)  rate 0.34, slope 0  -- flat
;   this file                      rate 0.00, slope 1  -- measured
;
; No number here is invented. 0.34 is the shipped PLACEHOLDER, 1.0 is
; the point at which a slope on an already-dimensioned term asserts no
; scaling, and 0.0 is an off-switch, not a magnitude.

[tuning]
invasion_reinforce_rate = 0.0
invasion_reinforce_slope = 1.0
