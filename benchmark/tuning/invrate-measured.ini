; INVASION-RATE test arm: reinforcement IS production.
;
; The flat term off, the slope at its dimensional identity point, so
; the model charges exactly what the target city can measurably build
; per turn and nothing else.
;
; WHY THIS ARM RATHER THAN slope-ON-TOP-OF-flat. The probe answered it
; before the A/B could. robs= on deep-kill is the observed rate, and
; on the two cells now instrumented it sits ENTIRELY BELOW the flat
; 0.34:
;
;   smoke, seed 1, 1 036 observations to turn 84
;     mean 0.124  median 0.100  p90 0.200  max 0.300
;     fraction above the flat 0.34: 0.000
;   tech65sea-150, 3 seeds to turn 17, 41 observations
;     0.037 .. 0.188, every one of them below 0.34
;
; So `rate + 1.0 x observed` is not "the honest model" -- it is the
; flat model plus ~15-40%, an arm that can only answer "does deep
; fear garrisons MORE", which nothing in the campaign asked. The
; contrast the epic exists to draw is between two whole models:
;
;   control (tuning/identity.ini)  rate 0.34, slope 0  -- flat
;   this file                      rate 0.00, slope 1  -- measured
;
; Neither number is invented. 0.34 is the shipped PLACEHOLDER, 1.0 is
; the point at which a slope on an already-dimensioned term asserts no
; scaling, and 0.0 is an off-switch, not a magnitude.

[tuning]
invasion_reinforce_rate = 0.0
invasion_reinforce_slope = 1.0
