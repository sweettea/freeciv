; RAIL UPGRADE ON arm: tuning/w12g-keep-on.ini unchanged, plus the
; corridor upgrade gate. Differs from that file in exactly ONE key, so
; the comparison reads what re-opening a FINISHED trunk does to the
; corridor family as it stands -- W12 slices 1-4 plus W12G's two
; keepable-bid fixes, which is the arm every corridor number since
; 2026-08-22 was taken on.
;
; worker_travel_discount = 1.0, trunk_road_gain = 5.0,
; trunk_source_gain = 1.0, trunk_ally_gate = 1, trunk_trade_gain = 1.0,
; trunk_keepable_gate = 1 and trunk_keep_margin = 0.25 are carried over
; verbatim from tuning/w12g-keep-on.ini. They carry no claim here; they
; are the shared background both arms stand on.
;
; trunk_upgrade_gate = 1 is geometry, not a magnitude: a finished
; corridor either is re-examined against the roads the player can now
; build or it is not. The price above the gate is the SAME
; deep_trunk_price() the family already uses, with its "cost before the
; work" half read off the roads on the ground (link->cur) instead of off
; bare terrain (link->terr) -- an upgrade is worth the difference, not
; the whole. There is no magnitude here and the knob owes no tuning
; pass.
[tuning]
worker_travel_discount = 1.0
trunk_road_gain = 5.0
trunk_source_gain = 1.0
trunk_ally_gate = 1
trunk_trade_gain = 1.0
trunk_keepable_gate = 1
trunk_keep_margin = 0.25
trunk_upgrade_gate = 1
