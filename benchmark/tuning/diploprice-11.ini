; S-DIPLOPRICE 2x2 (findings/diploprice-verdict-2026-08-30.md).
;
; Two gates on ONE build auction -- both change what a city orders in
; the same turn band, so a shield one frees is a shield the other can
; spend. Read as one 2x2, never as two A/Bs (CLAUDE.md,
; "Parallelise scheduling, not attribution").
;
;   D  diplo_price_gate   the defensive diplomat, priced off OBSERVED
;                         diplomat-class presence and the tech gap
;   M  mil_infra_gate     Barracks / City Walls / Coastal Defense,
;                         gated on stock's MEASURED danger
;
; Cell names are DM in that order. 00 is the CONTROL: compiled
; defaults exactly, which is the tuning s6-nogates-war ran, so the
; control arm IS the corpus the census was measured on. Every cell
; loads a file, so "a file was loaded" is never a second difference
; between arms.
;
; EVERY VALUE IN THE OTHER CELLS IS DERIVED FROM THE CENSUS, NOT
; CHOSEN (rule 7); the derivations are written in each cell file. All
; of them remain PLACEHOLDER and are flagged in STATUS.md for a tuning
; pass. What this factorial adjudicates is the GATE DEFAULT, not the
; values.
;
; THE VALUES, DERIVED NOT CHOSEN (rule 7).
;
;   diplo_evidence_floor = 1 -- the literal reading of the flag's own
;       comment, "Enemy diplomat or spy is near the city"
;       (daicity.h:58). Not a magnitude: the unit case of "an enemy
;       diplomat was actually observed". Measured justification: of
;       the cities with a hostile-capable unit within two tiles, only
;       28.6% (contested) / 21.2% (lategame-80) had an enemy diplomat
;       within the same radius, and 85% / 83% of the diplomats the
;       flag bought end the game standing in one of our own cities
;       having never reached an action seam.
;   diplo_gap_floor = 0 -- SHIPPED AND DELIBERATELY UNTESTED. The
;       census gives no threshold for what an enemy diplomat would
;       come here to take, and inventing one to have something to
;       sweep is exactly the failure rule 7 names.
;   mil_infra_threat_floor = 1 -- the unit case again: at least one
;       enemy unit that stock's own assess_danger() scored above zero.
;       Measured justification: 44.0% / 25.2% Barracks delivery, 38.4%
;       / 40.9% City Walls, 20.9% Coastal Defense, and deep finishing
;       with half to a tenth of BASELINE's Barracks on the same seeds.
;
; PRE-REGISTERED FALSIFICATIONS.
;
;   D must cut Diplomat picks and Diplomat deliveries and must NOT
;   raise `unitslost` or cities-taken-from-us. The line it refuses has
;   never been observed doing anything -- 0 spy actions, 0.08 / 0.53
;   city transfers per player-game with BASELINE suffering more -- so
;   if unitslost or transfers rise, the diagnosis is wrong and the
;   finding gets re-read, not the tuning re-swept.
;
;   M must cut mil-infra STARTS and abandoned runs while leaving
;   DELIVERED mil-infra shields at least flat. It is a churn fix, not
;   a repricing: if delivered Barracks and City Walls fall with the
;   starts, the gate is cutting the runs that would have finished and
;   must not ship.
;
; --- cell 11: D + M ---
[tuning]
diplo_price_gate           = 1
diplo_evidence_floor       = 1
diplo_gap_floor            = 0
mil_infra_gate             = 1
mil_infra_threat_floor     = 1
