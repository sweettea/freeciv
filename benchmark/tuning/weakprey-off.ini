; WEAK PREY, OFF arm. Compiled defaults with the gate stated
; explicitly at its compiled value, so the two arms of the adjudication
; are one key apart and the off arm's provenance is in the file rather
; than in the absence of a file.
;
; weak_prey_gain is deliberately NOT restated: it is inert while the
; gate is 0 and repeating it here would put a second difference between
; the arms for a reader to have to discount.
[tuning]
weak_prey_gate = 0
