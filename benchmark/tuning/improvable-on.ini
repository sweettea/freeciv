; SITE-IMPROVABLE arm A: achievable-yield pricing of the potential
; term, and nothing else.
;
; One key, and it is a GATE with no companion magnitude, for the same
; reason terrain_chain_gate has none: every number inside it is read
; rather than chosen. The candidate improvements are the ruleset's
; (irrigate, mine, and every terrain deepterra.c's cultivate/plant graph
; reaches), their costs are the ruleset's own activity times, the
; weights are adv_data's food/shield/trade priorities, and the discount
; is amortize() at MORT 24 -- the discounter every other delay in
; ai/deep is already priced at. site_potential_weight and
; site_potential_discount keep their existing meanings on top of it and
; are left at their compiled values here, so a comparison between this
; file and no file at all reads this mechanism and no background.
;
; The OFF arm for any comparison against this file is the compiled
; defaults (no tuning file), where both gates are 0 and the evaluator
; does the arithmetic it has always done.
[tuning]
site_improvable_gate = 1
