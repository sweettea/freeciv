; Single-knob probe arm for the hut-risk sign correction.
;
; hut_risk_honest = 1 charges hut_risk_discount against the huts the
; SERVER would actually let unleash barbarians -- none of any player's
; cities within CITY_MAP_MAX_RADIUS, the test in
; data/default/default.lua:112 and server/unittools.c:3321 -- instead
; of the huts near an own city, which are precisely the ones the
; server refuses to unleash at.
;
; Everything else is compiled defaults, so this file is the ON arm of a
; one-knob A/B against tuning=none. Venue: huts.conf (HUTS=150) or the
; classic hut cells, where the discounted population is nonzero.
;
; NOT a tuning result. hut_risk_discount stays at its untuned 0.25
; here on purpose: the flip and the discount's magnitude are separable
; questions and this arm asks only the first. The second is coupled to
; explore_hut_value, which v3b's tuner has been zeroing on classic in
; response to the wrong sign -- that pair wants a factorial, not two
; sequential single-knob arms.
[tuning]
hut_risk_honest = 1
