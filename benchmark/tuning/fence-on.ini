; FENCE arm (2026-08-13, task #63): pv3 -- THE COMPOSED BASELINE --
; with `diplo_deep_only_pacts` up and nothing else changed, so a
; pv3-vs-this pair is a single-lever A/B on the fence.
;
; The control is pv3.ini itself. pv3 is the right base rather than a
; bare default file because the fence NARROWS a dividend pv3 already
; pays: peace_seek_gain 0.80 signs the peace treaties, gift_love_gain
; 46.59 and proxy_arm_gain 11.05 spend real advances, and the gift
; classes (11.4's fold) already decide WHO gets paid. This knob
; decides who deep will be in a pact with at all.
;
; Provenance of every other key: benchmark/tuning/pv3.ini, verbatim.
