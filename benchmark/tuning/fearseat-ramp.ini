; S-FEARSEAT, RAMP rung. Anticipatory fear (density, prior) scales
; from 0 toward full weight over the first N turns.
;
; N = 62 is MEASURED, not chosen: over the archived 20-game
; s6-nogates-war holdout arm, the turn at which combat first touches a
; deep player (first deep-loss reason="killed") has median 62.5, mean
; 62.5, min 27, max 120; the first city loss has median 105 (n=9 of
; 20). The ramp therefore reaches full weight at the turn violence
; historically arrives in this venue. It remains a PLACEHOLDER and
; owes the tuning pile a value; the range is in tuning-params.ini.
[tuning]
density_fear_ramp_turns = 62
fear_evidence_gate = 0
mil_opportunity_gate = 0
boat_shadow_gate = 0
