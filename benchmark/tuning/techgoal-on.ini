; TECHMIL slice 2 arm: compiled defaults with the research-goal
; reselection gated ON at stock's own distance shape.
;
; The control is identity.ini (zero keys = compiled defaults), which is
; the tuning the slice-1 census measured the 47.5%-vs-68.4% research
; gap under -- so an identity-vs-this pair is a single-lever A/B on the
; reselection seam itself, at the same operating point the defect was
; measured at.
;
; power = 1.0 is DELIBERATELY stock's shape: this arm isolates what the
; seam alone does (double-precision selection replacing stock's
; int-truncated one, applied as a post-pass). The power sweep is a
; separate, owed tuning pass -- see tuning-params.ini for its bounds.
[tuning]
techgoal_deep = 1
techgoal_distance_power = 1.0
