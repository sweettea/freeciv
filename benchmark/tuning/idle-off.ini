; Idle-worker policy A/B, OFF arm: the carpet exactly as it is today.
;
; Differs from tuning/idle-on.ini in exactly ONE key -- idle_policy_gate
; -- so a comparison between the two files reads the policy alone.
;
; idle_reserve_per_city is written here as well as in the ON file, at
; the SAME value, precisely so that the one-key property holds. It is
; inert at this gate by construction (deep_idle_policy() returns before
; consulting it), and 0.0 is also the compiled default, so this file is
; behaviourally the compiled defaults.
;
; The value is DERIVED, not chosen. The reserve exists to answer
; pollution, and the reserve's size is the mean concurrent pollution
; events a cluster carries. Measured on this venue with this binary --
; contested (8p 32x32 T150 civ2civ3), 4 games, 16 deep player-games,
; benchmark/results/idle-pilot:
;
;     polluted catchment tile-turns  0
;     pollution arrival events       0
;     percity = tileturns/cityturns  0.0000
;
; Zero pollution in 2400 player-turns: at T150 in civ2civ3 nobody has
; reached the industry that produces it. So the derivation returns
; 0.0000 and the reserve is UNDER-DOSED at this venue by construction --
; the ON arm therefore measures the recycle leg, and the reserve leg
; fires only as the fail-safe (nothing safely reachable to walk to).
; Reporting that is the honest answer; picking a reserve the venue
; cannot justify would be rule 7's failure mode.
[tuning]
idle_policy_gate = 0
idle_reserve_per_city = 0.0
