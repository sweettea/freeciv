; EXPANSION slice 2 liveness arm: the hull commission switched on, and
; the muster-phase mission release with it.
;
; hull_commission_weight = 1.0 is the IDENTITY scaling of a term whose
; every other factor is already measured or a ruleset fact --
;
;     want = amortize(w x n x (value - amortize(value, wait)), build)
;
; n berths from the gap census, value = colony_want aged by amortize(),
; wait = deep_wait_expected() -- so 1.0 means "charge exactly the delay
; the hull removes, undiscounted and unmultiplied". It is a PLACEHOLDER
; pending benchmark/tune.py, flagged as such in STATUS, and no A/B has
; been run on it.
;
; lift_muster_release = 1 is a 0/1 switch, not a magnitude: it lets the
; gather drop a passenger whose target died the same way the crossing
; already does.
;
; This file is for LIVENESS -- two seeds price nothing, and the arms
; diverge from the first firing. The A/B is queued for the daytime
; machine, one knob at a time on isolated-150.

[tuning]
hull_commission_weight = 1.0
lift_muster_release = 1
