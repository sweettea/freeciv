; Idle-worker policy A/B, ON arm: tuning/idle-off.ini with the gate
; open, and nothing else changed. One key apart.
;
; What the gate does (deepidle.c): a dedicated worker whose best
; candidate is nothing at all, or a fortress -- the backlog-empty state
; the fortress measurement traced -- is held idle in place while the
; empire is under its reserve target, and otherwise walks to the
; nearest own city and is recycled into its build queue for half its
; shields. Reclaim needs no code: a held worker stays IDLE, and
; auto_workers_player() re-offers an IDLE worker to the auction every
; turn.
;
; idle_reserve_per_city = 0.0 is the DERIVED value, not a chosen one --
; see the derivation in tuning/idle-off.ini. The venue carries no
; pollution at 150 turns, so the reserve target is round(0.0 * cities)
; = 0 for every empire and this arm measures the recycle leg. Under a
; venue that reaches industry the same derivation would return
; something else, and the knob is where it goes.
[tuning]
idle_policy_gate = 1
idle_reserve_per_city = 0.0
