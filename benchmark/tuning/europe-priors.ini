; EYEBALLED PRIORS from the T76 Europe playtest (findings/europe-T76.md).
;
; Human-authorised on 2026-08-01 as an explicit, scoped exception to
; rule 7: these are START VALUES for the tuning campaign, not compiled
; defaults and not tuned results. Nothing here has been benchmarked.
; Use as:
;
;   tune.py --start benchmark/tuning/europe-priors.ini --blocks S,X,G,M ...
;
; The tuner overwrites every one of them; the point is to start the
; search near the evidence instead of at placeholders chosen before
; any game had been played. Delete this file once a tuned result
; exists.
;
; Every direction below was checked against the knob's USE SITE, not
; assumed from its name -- two of them turned out to be the opposite
; of the obvious guess (marked !!).
[tuning]

; --- Expansion: the headline defect -----------------------------
; T76: deep wants to found from 12% of its cities (9/76, max ~545);
; classic from 41% (41/100, up to 1105). Zero settlers alive or
; queued across six deep players. Deep is not failing to execute
; expansion, it is failing to want it.

; Doubling the advisors' stacking fearfulness prices every settler
; path through a war zone, and amortize() then de-ranks the sites
; behind it. On a crowded, war-heavy map that suppresses nearly
; every site at once. 1.0 = exactly stock's fearfulness.
;
; STATUS 2026-08-01: a 0.5/1.0/2.0/4.0 sweep on `contested` was
; INCONCLUSIVE and is not evidence for this value. Two of its three
; seeds showed zero founder want at EVERY setting -- contested gives
; 38 land tiles per player, so there is no room to want and the cell
; cannot measure expansion appetite. Re-testing on isolated-150,
; which has room (235 tiles/player). Treat this prior as a hypothesis
; awaiting its experiment.
settler_fearfulness_mult = 1.0

; !! Multiplies a catchment tile's improvement potential when a
; non-allied city is within contest range. At 0.3 a pressured site
; keeps only 30% of its potential -- and in Europe essentially every
; site is pressured, so this discards most of the map's value.
site_pressure_factor = 0.6

; Founding next to a rival denies them the space. On a map where the
; land is the whole game, that is worth more than the placeholder.
site_claim_bonus = 12.0

; Amplifies fresh founder wants by (1 + w * crowding). NOTE it can
; only scale a want that is already positive -- it cannot create one,
; so it does nothing for the 88% of deep cities sitting at zero. Kept
; modest for that reason.
settler_rush_weight = 1.5

; --- Buildings: zero ladder across 76 cities --------------------
; T76: deep holds no Temple, Marketplace, Library, Granary or
; Aqueduct anywhere, against classic's 44 such buildings. (Deep does
; build wonders, and its cities are BIGGER, so this may cost less
; than it looks -- measure before believing it is a defect.)

; !! This charges the ruleset's gold upkeep against every BUILDING's
; credit -- it discourages buildings, not units. At 3x, and with
; civ2civ3 charging gold for everything, it is the prime suspect for
; the empty ladder. Halved, not zeroed: it was added because deep
; really did bankrupt itself on building upkeep.
upkeep_gold_weight = 1.5

; The growth-accelerator share of the capacity credit.
horizon_growth_weight = 1.0

; --- Army size and the treasury ---------------------------------
; T76: deep fields 57% more military than classic (14.3 vs 9.1 per
; player) on near-identical tax rates, and holds a quarter of the
; gold (166 vs 603). The drain is units, not buildings.

; A DISCOUNT divisor on injected fear: 1/(1 + w * cheapest_upkeep).
; Raising it charges the marginal defender more, so fear buys fewer
; of them.
upkeep_unit_weight = 1.0

; The standing fears, trimmed together rather than one at a time --
; they sum into the same danger field and the army is ~57% too big.
survival_fear_value = 15.0
barbarian_fear = 20
boat_shadow_fear = 15
density_fear_value = 4
garrison_floor_danger = 30
wall_fear_weight = 0.2

; --- Diplomats --------------------------------------------------
; T76: 4.2 per deep player vs 2.0 for classic; second time the count
; has been flagged. The placeholder was derived from a corpus of
; emergency-tier values, never tuned.
diplomat_defence_value = 150.0
