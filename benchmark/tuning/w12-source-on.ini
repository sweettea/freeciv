; W12 slice 2 ON arm: slice 1's probe values unchanged, plus the task
; source switched on at its unit case. Differs from tuning/w12-on.ini
; in exactly ONE key, so an A/B between the two files reads the source
; alone.
;
; worker_travel_discount = 1.0 and trunk_road_gain = 5.0 are the same
; untuned probe values w12-on.ini documents; they carry no claim here
; either, they are the shared background both arms stand on.
;
; trunk_source_gain = 1.0 is the unit case, not a choice of magnitude:
; a beyond-ceiling corridor tile is priced exactly as the task-value
; hook prices the same corridor inside a radius. The knob ships at 0.0
; and is registered PLACEHOLDER.
[tuning]
worker_travel_discount = 1.0
trunk_road_gain = 5.0
trunk_source_gain = 1.0
