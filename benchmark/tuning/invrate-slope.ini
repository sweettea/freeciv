; INVASION-RATE test arm: the reinforcement slope at its DIMENSIONAL
; identity point.
;
; The term the slope multiplies is already in the model's own units --
; defenders per turn, surplus[O_SHIELD] / cost(best buildable
; defender) -- so 1.0 is not a magnitude picked because it looked
; reasonable (rule 7). It is "believe the observed production rate,
; and keep the flat term on top of it": the one point on the axis
; that asserts no extra scaling at all. Everything else on 0..3 is a
; claim about how much reinforcement the production channel misses
; (gold buys, units marching in from a neighbour), and that is a
; tuning question, not an A/B question.
;
; The control is tuning/identity.ini -- every compiled default,
; slope 0, which is the flat model this shipped with.

[tuning]
invasion_reinforce_slope = 1.0
